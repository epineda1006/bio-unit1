 later:"Every definition problem in biology, from viruses to prions to synthetic cells, comes back to this list."}],

["life","Are viruses alive?",{
 harder:"Prions are worse. They are misfolded proteins with no genetic material at all, and they reproduce by forcing normal proteins to misfold into the same shape. Are they alive? By every criterion, no. They do not even have a genome. Yet they replicate and cause fatal disease. If you can explain why a prion is not alive but still dangerous, you have understood that being alive and being biologically active are different questions.",
 field:"Prion diseases like Creutzfeldt-Jakob are diagnosed on autopsy by a pathologist, and the tissue shows a distinctive spongy pattern. It is one of the few diagnoses that is definitively pathological rather than clinical.",
 later:"The virus question reappears in microbiology and in every discussion of what counts as an infectious agent."}],

["life","What is homeostasis",{
 harder:"Distinguish negative from positive feedback with one example each. Negative feedback reverses a change and is the basis of nearly all homeostasis, like sweating when hot. Positive feedback amplifies a change and is rare because it is unstable, but childbirth uses it: contractions release oxytocin, which causes stronger contractions, until delivery ends the loop.",
 field:"Disease is very often homeostasis failing. Diabetes is failed blood glucose regulation, hypertension is failed blood pressure regulation, and fever is homeostasis working with the set point deliberately moved.",
 later:"A&P spends entire units on this. Nearly every organ system is explained as a homeostatic mechanism."}],

["life","Rank the levels of biological organization",{
 harder:"Which level would a pathologist work at most of the time? Tissue, primarily, which is what histology is. But the answer is really that pathology crosses levels constantly: a tissue abnormality gets explained by a cellular change, which gets explained by a molecular one. Being able to move up and down this ladder is the actual skill.",
 field:"Histopathology is literally the study of the tissue level. A biopsy is a tissue sample, read for cellular abnormalities that predict organism-level disease.",
 later:"This ladder is how every later biology course is organized."}],

["life","What is emergence",{
 harder:"Is consciousness an emergent property, and can it be explained by studying neurons alone? This is a real open argument, not a settled answer, and that is the point. A strong answer says: emergent properties can be studied at the lower level, but they cannot be predicted from it, which is why reductionism alone runs out.",
 later:"Systems biology as a field exists because of this limitation."}],

["life","What is reductionism",{
 harder:"Give one thing reductionism explains beautifully and one thing it fails at. It explains sickle cell disease perfectly: one DNA base change, one amino acid change, one misshapen protein, one disease. It fails at something like depression, where no single molecule accounts for the condition and the explanation has to sit at several levels at once.",
 field:"Molecular pathology is reductionism applied: identify the exact genetic lesion causing a cancer, then target it with a drug built for that lesion.",
 later:"This tension shows up in every genetics and neuroscience course you take."}],

["life","structure relating to function",{
 harder:"Run the logic backwards. You are shown an unfamiliar cell under a microscope that is packed with mitochondria and has a hugely folded membrane. What does it probably do? Something enormously energy-expensive with a lot of transport, like a kidney tubule cell or cardiac muscle. Predicting function from structure is exactly what a pathologist does with an unfamiliar slide.",
 field:"This is the core reasoning skill of histology. You identify tissue and spot abnormality by reading shape, arrangement, and staining pattern, then inferring what the cell was doing or failing to do.",
 later:"Histology and A&P are essentially two years of this one skill."}],

["life","most fundamental unit of life",{
 harder:"Mitochondria have their own DNA, their own ribosomes, and divide independently. Why are they still not alive? Because they cannot survive or reproduce outside a host cell, and they depend on nuclear genes for most of their proteins. The endosymbiotic theory says they used to be free-living bacteria, which makes this a case of something that was alive and is no longer independently so.",
 field:"Mitochondrial DNA is inherited only from the mother and mutates faster than nuclear DNA, which makes it useful in both genetic disease diagnosis and forensic identification.",
 later:"Endosymbiotic theory gets a full treatment in cell biology and evolution."}],

["life","Put natural selection",{
 harder:"Antibiotic resistance is natural selection you can watch in a week. Walk through it: a bacterial population already contains rare variants with resistance; the antibiotic kills the susceptible ones; the resistant ones survive and reproduce; the population is now mostly resistant. Note what did NOT happen: the bacteria did not develop resistance because of the antibiotic. The variation was already there.",
 field:"Antibiotic resistance patterns are tracked by clinical microbiology labs, and hospital prescribing guidelines are set from that data. It is one of the most direct ways evolution touches daily medicine.",
 later:"Evolution is a full unit of the MCAT biology section and underlies all of genetics."}],

/* ===== Chemistry of Life ===== */
["chem","What is matter, and what is an element",{
 harder:"Why is it CHON specifically, and not any other four elements? Because they are small, they form strong covalent bonds, and they can form multiple bonds, which lets them build stable, complex, varied molecules. Bigger atoms form weaker, longer bonds that break too easily to hold a genome together.",
 later:"Chem 1A opens with atomic structure and periodicity, which is the formal version of this."}],

["chem","structure of an atom",{
 harder:"Almost all of an atom's mass is in a nucleus that occupies almost none of its volume. If an atom were the size of a football stadium, the nucleus would be a marble at the center. So why does matter feel solid? Because you never touch nuclei, you feel electron shells repelling each other.",
 later:"Chem 1A will push this into orbitals and quantum numbers. The shell model you are learning now is a simplification you will later replace."}],

["chem","element's identity determined",{
 harder:"Why is the atomic mass on a periodic table a decimal, like 12.011 for carbon, when protons and neutrons are whole numbers? Because it is a weighted average of all naturally occurring isotopes. Carbon is mostly carbon-12 with a small fraction of carbon-13, and averaging them lands just above 12.",
 later:"You will use atomic masses constantly in Chem 1A stoichiometry, so knowing why they are decimals helps."}],

["chem","What are isotopes",{
 harder:"Carbon-14 dating has a limit of roughly 50,000 years. Why? Because half-life is exponential: after enough half-lives, so little carbon-14 remains that measurement error swamps the signal. Older samples need isotopes with longer half-lives, like potassium-40.",
 field:"PET imaging uses a radioactive glucose analog. Tumors consume glucose faster than normal tissue, so they light up. That is an isotope being used as a functional diagnostic, not just a structural image.",
 later:"Half-life calculations show up in Chem 1A and on the MCAT."}],

["chem","electron shells and the octet rule",{
 harder:"Predict the bonding behavior of oxygen (6 valence electrons), nitrogen (5), and hydrogen (1) without memorizing. Oxygen needs 2 more, so 2 bonds. Nitrogen needs 3, so 3 bonds. Hydrogen needs 1, so 1 bond. Now look at a water molecule, an ammonia molecule, and methane, and notice you could have predicted all three structures.",
 later:"Lewis structures in Chem 1A are this rule applied systematically."}],

["chem","What is an ion?",{
 harder:"Why is the inside of a resting nerve cell negative compared to the outside? Because a pump moves three sodium ions out for every two potassium ions in, and the membrane leaks potassium back out. The result is a charge difference stored across the membrane, ready to be released as a nerve signal. Every thought you have is ions moving.",
 field:"Electrolyte panels are among the most ordered lab tests in medicine. Abnormal potassium can stop a heart, and abnormal sodium can cause seizures, both because of this same membrane physics.",
 later:"Membrane potential is a major topic in A&P and in the MCAT biology section."}],

["chem","Covalent bonds: polar vs nonpolar",{
 harder:"Carbon dioxide has two polar C=O bonds, yet the molecule as a whole is nonpolar. Why? Because it is linear and the two bond dipoles point in exactly opposite directions and cancel. Water has two polar bonds too, but it is bent, so they do not cancel. Shape decides molecular polarity, not just bond polarity.",
 later:"Molecular geometry and VSEPR theory in Chem 1A formalize exactly this."}],

["chem","What is a hydrogen bond",{
 harder:"A-T pairs share two hydrogen bonds, G-C pairs share three. Predict which region of DNA a cell can unzip more easily, and where you would expect a replication origin to sit. The AT-rich regions, because fewer hydrogen bonds means less energy to separate. Replication origins are in fact AT-rich, and that is not a coincidence.",
 field:"PCR, used in everything from infection testing to genetic diagnostics, relies on heating DNA until hydrogen bonds break. GC-rich sequences require higher temperatures, which is why lab protocols specify melting temperatures.",
 later:"This exact fact underlies DNA replication in genetics and PCR in any molecular lab."}],

["chem","Why is water polar",{
 harder:"Why does ice float, and why does that matter for life? Hydrogen bonds lock water into an open lattice when it freezes, making solid water less dense than liquid. So lakes freeze from the top down, insulating the water below, which lets aquatic life survive winter. If ice sank, bodies of water would freeze solid from the bottom.",
 later:"Intermolecular forces are a full unit in Chem 1A and explain boiling points, solubility, and phase behavior."}],

["chem","four emergent properties of water",{
 harder:"Pick sweating and trace it all the way down to electronegativity in one chain, no skipped links. Oxygen is more electronegative, so bonds are polar, so the molecule has partial charges, so molecules hydrogen bond to each other, so a lot of energy is needed to separate them into vapor, so evaporating sweat removes a lot of heat from your skin. Being able to say that without stopping is the depth this course wants.",
 field:"Fever management, burn patients losing fluid through damaged skin, and dehydration all come back to water's thermal properties.",
 later:"Thermoregulation is a whole chapter in A&P."}],

["chem","Hydrophilic vs hydrophobic",{
 harder:"Soap has a charged head and a long nonpolar tail. Explain how that lets it remove grease with water. The tails bury themselves in the grease while the heads face outward into the water, forming a micelle that carries the grease away. Notice this is exactly the phospholipid principle, just with one tail instead of two.",
 field:"Drug design depends on this constantly. A drug that is too hydrophilic will not cross a cell membrane; one too hydrophobic will not dissolve in blood. Most drugs are engineered compromises.",
 later:"Membrane transport in A&P and pharmacology both start here."}],

["chem","Acids, bases, and the pH",{
 harder:"Stomach acid sits around pH 2 and blood around pH 7.4. That is more than five pH units, which means over 100,000 times the hydrogen ion concentration. How does the stomach avoid digesting itself? Mucus layer, bicarbonate secretion, and rapid cell turnover. When those defenses fail, you get an ulcer.",
 field:"Arterial blood gas analysis is a core diagnostic test, and it is read almost entirely in terms of pH, bicarbonate, and carbon dioxide.",
 later:"Acid-base chemistry is a major Chem 1A unit and a heavily tested MCAT topic."}],

["chem","Strong vs weak acids",{
 harder:"Why can you drink vinegar, which is an acid, but not hydrochloric acid at the same concentration? Because acetic acid is weak and only partially dissociates, so the actual hydrogen ion concentration is far lower even at the same molarity. Concentration and strength are two different things, and mixing them up is one of the most common chemistry errors.",
 field:"Acidosis and alkalosis are managed by understanding which buffer systems are still available. A patient's bicarbonate level tells you how much buffering capacity is left.",
 later:"Titration curves and pKa in Chem 1A are the mathematical version of this card."}],

["chem","What is a buffer",{
 harder:"Someone hyperventilating blows off carbon dioxide. Carbon dioxide combines with water to form carbonic acid, so losing it removes acid, and blood pH rises. That is respiratory alkalosis, and it causes tingling and dizziness. Breathing into a bag works because it puts carbon dioxide back. Trace that chain out loud, it links three chapters at once.",
 field:"The bicarbonate buffer system is measured directly in every arterial blood gas, and interpreting it is a daily clinical task.",
 later:"Buffer calculations and Henderson-Hasselbalch are standard Chem 1A material."}],

["chem","Why is carbon the backbone",{
 harder:"Silicon also has four valence electrons and sits directly below carbon. Why is life not silicon-based? Silicon-silicon bonds are weaker and longer, silicon does not readily form double bonds, and silicon dioxide is a solid rather than a gas, so a silicon-based organism could not exhale its waste. That last point is usually the one people miss.",
 later:"Organic chemistry is an entire two-semester course built on carbon's bonding behavior."}],

["chem","What are hydrocarbons",{
 harder:"Why does fat store roughly 9 calories per gram while carbohydrate stores about 4? Because carbohydrates are already partly oxidized, with oxygen atoms attached throughout, while hydrocarbon chains are fully reduced. There is more energy to release when you oxidize something that has not been oxidized yet. Same reason gasoline is a hydrocarbon.",
 field:"This is the metabolic basis for why the body stores long-term energy as fat rather than glycogen. Glycogen also carries water with it; fat does not.",
 later:"Oxidation states and metabolism connect here in both Chem 1A and biochemistry."}],

["chem","Isomers: structural",{
 harder:"Thalidomide was sold as a mixture of both enantiomers. One treated morning sickness, the other caused severe birth defects. Even worse, the body converts one into the other, so separating them would not have solved it. Explain why a cell can tell them apart at all: receptors and enzymes have three-dimensional binding sites, so only one handedness fits, exactly like a glove.",
 field:"Modern drug development requires testing single enantiomers separately, and this tragedy is the direct reason that regulation exists.",
 later:"Stereochemistry is a major organic chemistry topic and a recurring MCAT theme."}],

["chem","Cis-trans isomers",{
 harder:"Vision starts with a cis-trans isomerization. Light hits retinal in your eye and flips it from the cis form to the trans form, which changes the shape of the attached protein and fires a signal to your brain. A single double bond changing sides is the first physical step in seeing anything.",
 field:"Trans fats were banned from the US food supply because of their effect on cholesterol, a regulatory decision made entirely on the basis of molecular geometry.",
 later:"Alkene geometry is early organic chemistry material."}],

["chem","seven functional groups",{
 harder:"An amino acid has both a carboxyl group, which donates H+, and an amino group, which accepts it. At physiological pH, what happens? Both ionize at once: the carboxyl loses its hydrogen and goes negative, the amino gains one and goes positive. The molecule carries both charges simultaneously, which is called a zwitterion, and it is why amino acids are so soluble.",
 field:"Drug behavior in the body is largely predicted by functional groups, since they determine solubility, charge at blood pH, and which enzymes can process the molecule.",
 later:"Organic chemistry is organized entirely around functional groups. Learning them now is a genuine head start."}],

/* ===== Macromolecules ===== */
["macro","four classes of biological macromolecules",{
 harder:"Rank the four by how much energy each stores per gram and explain the ranking. Lipids are highest at about 9 calories per gram because their hydrocarbon chains are fully reduced. Carbohydrates and proteins are both around 4. Nucleic acids are not used for energy at all, because their job is information, and burning your own instructions would be a design flaw.",
 later:"Biochemistry devotes a unit to each of these four."}],

["macro","Dehydration synthesis vs hydrolysis",{
 harder:"Every digestive enzyme you have is a hydrolase, meaning it performs hydrolysis. Amylase hydrolyzes starch, lipase hydrolyzes fat, protease hydrolyzes protein. Explain why digestion has to be hydrolysis and not something else: polymers are too large to cross a membrane, so they must be cut back into monomers, and water is the tool that cuts.",
 field:"Pancreatic insufficiency is diagnosed partly by undigested fat in stool, which is hydrolysis failing at the organ level.",
 later:"Enzyme kinetics in biochemistry begins with reactions exactly like these."}],

["macro","carbohydrates, and what is the general formula",{
 harder:"Deoxyribose is C5H10O4. Does it fit the 1:2:1 rule? No, it is one oxygen short, which is exactly what deoxy means. So is it still a carbohydrate? Yes. The formula is a generalization, not a law, and modified sugars break it routinely.",
 later:"You will meet many modified sugars in biochemistry, and almost none follow the ratio exactly."}],

["macro","Monosaccharides: name three",{
 harder:"Why does the body convert almost everything to glucose specifically, rather than running on fructose or galactose? Because glycolysis, the central energy pathway, takes glucose as its input, so every other sugar gets converted in the liver first. That conversion step is why fructose is metabolized differently and why high fructose intake stresses the liver.",
 field:"Blood glucose, not blood sugar in general, is what gets measured in diabetes, and this is why.",
 later:"Glycolysis is one of the first pathways you memorize in biochemistry."}],

["macro","Aldose vs ketose",{
 harder:"Glucose and fructose are both C6H12O6, so why is fructose noticeably sweeter? Sweetness comes from how the molecule fits taste receptors on your tongue, and the ketose arrangement fits better. Same atoms, different shape, different receptor fit, different perception. It is the structure-function principle showing up in something you can taste.",
 later:"Sugar chemistry and ring formation are early biochemistry topics."}],

["macro","How do disaccharides form",{
 harder:"Lactose intolerance is extremely common worldwide, and the ability to digest lactose as an adult is the unusual trait, not the other way around. It evolved separately in populations with a long history of dairy farming. Explain what that is an example of: natural selection acting on a digestive enzyme within human history.",
 field:"Lactose intolerance is diagnosed by a hydrogen breath test, because undigested lactose gets fermented by gut bacteria which produce hydrogen gas.",
 later:"This is a standard example in genetics for recent human evolution."}],

["macro","Starch, glycogen, and cellulose",{
 harder:"Cows cannot digest cellulose either. So how do they live on grass? Symbiotic microbes in their rumen produce cellulase and break it down for them, and the cow absorbs the products. Termites do the same thing. The lesson: the enzyme is what is missing, not the ability to use the energy.",
 field:"Gut microbiome composition affects how much energy a person extracts from the same food, and it is an active research area in metabolic disease.",
 later:"Microbiome work is one of the fastest growing areas in medical research."}],

["macro","Chitin and the other structural",{
 harder:"Fungi have chitin cell walls, while human cells have no cell wall at all. Why is that useful for treating fungal infections? Because a drug that attacks chitin synthesis has no human target to damage. Selective toxicity, the principle of hitting something the pathogen has and you do not, is the basis of nearly every antimicrobial.",
 field:"Antifungal drugs are harder to design than antibacterials precisely because fungi are eukaryotes like us, so there are fewer unique targets.",
 later:"Selective toxicity is a core principle in microbiology and pharmacology."}],

["macro","What defines a lipid",{
 harder:"Vitamins A, D, E, and K are lipids, which means they are stored in body fat rather than excreted in urine. What is the clinical consequence? Fat-soluble vitamins can accumulate to toxic levels if over-supplemented, while excess water-soluble vitamins mostly get urinated out. Solubility decides the toxicity risk.",
 field:"Vitamin D deficiency is one of the most commonly measured lab values, and fat malabsorption disorders cause deficiency in all four at once.",
 later:"Nutrition and pharmacokinetics both organize around this distinction."}],

["macro","Structure of a triglyceride",{
 harder:"Trans fats are worse for you than saturated fats, even though both are straight chains. Why? They raise LDL like saturated fat does, but they also lower HDL, which saturated fat does not. The body also has no enzyme that evolved to handle a trans double bond, because they barely exist in nature.",
 field:"A lipid panel measuring LDL, HDL, and triglycerides is one of the most ordered blood tests in medicine, and everything on it traces back to this card.",
 later:"Lipid metabolism is a full biochemistry unit."}],

["macro","Structure of a phospholipid",{
 harder:"Membranes need to stay fluid, not freeze into a solid sheet. Two things keep them fluid: unsaturated tails with kinks that prevent tight packing, and cholesterol wedged between them. Fish living in cold water have more unsaturated tails in their membranes than tropical fish. Predict why, then check: colder environment, more kinks needed to stay fluid.",
 field:"Membrane fluidity affects how drugs cross into cells and how cells signal, and it changes measurably in some disease states.",
 later:"Fluid mosaic model and membrane transport are the opening chapters of cell biology."}],

["macro","makes steroids structurally different",{
 harder:"Steroid hormones pass straight through the membrane and bind receptors inside the cell, which means they change gene expression. Protein hormones like insulin cannot cross, so they bind surface receptors and trigger a relay inside. Predict which type acts faster and which lasts longer: protein hormones act in seconds, steroid hormones take hours but the effects persist.",
 field:"This is why corticosteroid treatment takes time to work and why stopping it abruptly is dangerous, since the body has adjusted its own production.",
 later:"Endocrinology in A&P is built on exactly this two-pathway distinction."}],

["macro","functions of proteins",{
 harder:"One gene mutation, one changed amino acid, one misshapen protein, one disease. Sickle cell anemia is exactly that: a single base change swaps glutamic acid for valine in hemoglobin, the protein clumps, and red blood cells distort into a sickle shape that blocks capillaries. Trace the whole chain from DNA to symptom out loud.",
 field:"Hemoglobin electrophoresis, a lab technique that separates proteins by charge, is the standard diagnostic for sickle cell. It works because that one amino acid change alters the protein's charge.",
 later:"This example appears in genetics, biochemistry, hematology, and on the MCAT."}],

["macro","Structure of an amino acid",{
 harder:"R groups sort into nonpolar, polar, acidic, and basic. Predict where each type ends up in a folded protein sitting in water: nonpolar R groups get buried in the interior away from water, polar and charged ones face outward. That single prediction explains most of tertiary structure, and it is the hydrophobic effect again.",
 field:"Protein misfolding causes Alzheimer's, Parkinson's, and prion disease, all of which are diagnosed by pathologists identifying characteristic protein deposits in tissue.",
 later:"You will memorize all 20 R groups in biochemistry. Learning the four categories now makes that far easier."}],

["macro","four levels of protein structure",{
 harder:"Which level does a mutation change directly, and which level actually causes the disease? A mutation changes primary structure, the sequence. But the disease comes from the tertiary structure being wrong, because that is what determines shape and therefore function. Primary determines tertiary, so changing one changes the other, but they are not the same level.",
 field:"Immunohistochemistry, a foundational pathology technique, uses antibodies that recognize the three-dimensional shape of specific proteins in tissue. If the protein is misfolded or absent, the stain shows it.",
 later:"Protein folding is a major biochemistry unit and a large open research problem."}],

["macro","What is denaturation",{
 harder:"Why is a fever above roughly 104 F dangerous, but a fever of 101 F is useful? Mild fever speeds immune response and slows pathogen growth. High fever begins to denature your own enzymes, and once enzymes lose their shape the reactions they catalyze stop. Above about 106 F, protein damage becomes widespread and irreversible.",
 field:"Formalin fixation, which is the first step for nearly every tissue sample that reaches a pathology lab, works by cross-linking proteins to lock structure in place before it degrades. It is controlled denaturation used deliberately.",
 later:"Enzyme activity and optimal conditions are standard biochemistry material."}],

["macro","nucleic acids and nucleotides",{
 harder:"ATP is a nucleotide. It is adenine, ribose, and three phosphates instead of one. So the energy currency of every cell is structurally an RNA building block with extra phosphates. Explain where the energy is: in the repulsion between those clustered negative phosphates, which is released when one is broken off.",
 field:"Many chemotherapy drugs are nucleotide analogs. They resemble real nucleotides closely enough to get incorporated into DNA, then stop replication, which kills fast-dividing cells.",
 later:"ATP appears in literally every metabolism chapter you will ever read."}],

["macro","Purines vs pyrimidines",{
 harder:"Gout is caused by uric acid crystals in joints, and uric acid is the breakdown product of purines specifically, not pyrimidines. That is why gout diets restrict organ meats and shellfish, which are purine-rich. A chemistry distinction you are learning for an exam turns out to explain a dietary restriction.",
 field:"Joint fluid aspiration examined under polarized light for needle-shaped urate crystals is the definitive gout diagnosis, and it is done in the lab.",
 later:"Nucleotide metabolism is a biochemistry unit, and gout is its standard clinical example."}],

["macro","Describe DNA's double helix",{
 harder:"Antiparallel means the two strands run in opposite directions, 5 prime to 3 prime on one and the reverse on the other. Why does that complicate replication? Because DNA polymerase can only build in one direction, so one strand is made continuously and the other in backwards fragments that get stitched together. That awkwardness is a direct consequence of antiparallel structure.",
 field:"Understanding strand directionality is required for reading any sequencing result, and sequencing is now routine in cancer diagnosis.",
 later:"Replication, transcription, and PCR all depend on this in genetics."}],

["macro","DNA vs RNA, and the three types",{
 harder:"RNA has an extra hydroxyl group on its sugar that DNA lacks, and it makes RNA more chemically reactive and less stable. Why would the cell want its long-term storage molecule to be the stable one and its messenger to be the unstable one? Because messages should expire. If mRNA lasted forever, the cell could never stop making a protein it no longer needs.",
 field:"mRNA vaccines exploit this instability deliberately. The mRNA delivers instructions, gets translated, and degrades within days, which is why it cannot alter your genome.",
 later:"Transcription and translation are the central topics of any genetics course."}],

/* ===== Viruses ===== */
["virus","basic structure of a virus",{
 harder:"Naked viruses survive far longer on surfaces than enveloped ones and resist alcohol sanitizer better. Explain why using the lipid card. The envelope is lipid, and both soap and alcohol disrupt lipids. A naked virus has only a protein capsid, so there is no lipid to disrupt. Norovirus is naked, which is why outbreaks spread through surfaces so effectively.",
 field:"Disinfection protocols in clinical labs are chosen based on whether the target pathogen is enveloped, and this is the reason.",
 later:"Microbiology covers viral classification and disinfection in detail."}],

["virus","so specific about which cells",{
 harder:"HIV infects helper T cells specifically because its surface protein binds the CD4 receptor, which those cells carry. That single binding specificity explains the entire disease: destroy the cells that coordinate immune response, and every other infection becomes dangerous. Specificity is not a detail, it determines what the disease looks like.",
 field:"CD4 counts are the standard monitoring test in HIV care, measuring exactly the cell population the virus targets.",
 later:"Receptor-ligand specificity underlies immunology and pharmacology both."}],

["virus","Walk through RNA virus replication",{
 harder:"Retroviruses like HIV add a step: reverse transcriptase copies their RNA genome into DNA, which then integrates into the host genome permanently. Explain why that makes the infection so hard to cure. The viral DNA becomes part of the cell's own chromosome, so eliminating it means eliminating the infected cell.",
 field:"Antiretroviral drugs target specific steps of this cycle, and combination therapy works because hitting several steps at once makes resistance far less likely.",
 later:"Viral replication strategies are a core microbiology topic."}],

["virus","Why do RNA viruses mutate so fast",{
 harder:"Influenza changes in two distinct ways. Antigenic drift is gradual mutation, and it is why the vaccine is updated yearly. Antigenic shift is two different flu strains infecting one cell and swapping whole genome segments, producing something the population has no immunity to at all. Shift is what causes pandemics, drift causes seasons.",
 field:"Flu strain surveillance and vaccine composition decisions are made annually from global lab data.",
 later:"Viral evolution is heavily tested on the MCAT and central to epidemiology."}],

["virus","Build a full answer",{
 harder:"Giant viruses like mimivirus are bigger than some bacteria and carry genes for protein synthesis machinery, which was thought to be impossible for a virus. Does that change the answer? It complicates it. They still cannot replicate independently, so most biologists still say no, but they show the boundary is blurrier than a textbook implies. Acknowledging that nuance is what a strong answer does.",
 later:"The definition of life stays genuinely unsettled, and you will meet it again in microbiology and astrobiology."}],

["virus","characteristics-of-life checklist",{
 harder:"Some argue viruses should count as alive while inside a host cell and not alive outside it, treating life as a state rather than a property. Evaluate that. It is coherent, but it breaks how we use the word everywhere else, since nothing else switches between alive and not alive. Whether you accept it or not, being able to weigh the argument is what a full-credit answer looks like.",
 later:"This framing appears in current origin-of-life research."}]
];

/* attach to cards */
DEEP.forEach(([dId, sub, obj]) => {
  const d = DECKS.find(x => x.id === dId); if(!d) return;
  const c = d.cards.find(c => c.q.indexOf(sub) !== -1);
  if(c) c.deep = obj;
});

<rect x="14" y="154" width="330" height="88" rx="12"/><rect x="356" y="154" width="330" height="88" rx="12"/>
</g>
<g class="f-acc f-txt" font-size="13.5" font-weight="700">
<text x="30" y="78">1. &#8220;Sticky&#8221; behavior</text><text x="372" y="78">2. High heat capacity</text>
<text x="30" y="178">3. Exists in three states</text><text x="372" y="178">4. Versatile solvent</text>
</g>
<g class="f-txt" font-size="12">
<text x="30" y="98">Cohesion: water to water</text><text x="30" y="116">Adhesion: water to other surfaces</text>
<text x="30" y="134" class="f-sm">water up a tree, surface tension, interstitial fluid</text>
<text x="372" y="98">Absorbs and releases a lot of heat</text><text x="372" y="116">with little temperature change</text>
<text x="372" y="134" class="f-sm">breaking and re-forming H bonds &#183; coastal vs inland CA</text>
<text x="30" y="198">Solid, liquid, gas &#183; ice FLOATS</text><text x="30" y="216">because molecules sit farther apart</text>
<text x="30" y="234" class="f-sm">drives the water cycle, distributes nutrients</text>
<text x="372" y="198">Polar dissolves polar: like dissolves like</text><text x="372" y="216">Solvent = the dissolver &#183; Solute = the dissolved</text>
<text x="372" y="234" class="f-sm">blood, cytoplasm, sap &#183; ionic solutes dissociate</text>
</g>
</svg>`;

FIG.phMath = `<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Working pH problems">
<text x="350" y="20" class="f-txt" text-anchor="middle" font-size="14" font-weight="700">The three equations that solve every pH problem</text>
<g class="f-none s-acc" stroke-width="1.6"><rect x="60" y="34" width="580" height="86" rx="12"/></g>
<g class="f-txt" text-anchor="middle" font-size="15" font-weight="700">
<text x="350" y="60">[H&#8314;] &#215; [OH&#8315;] = 10&#8315;&#185;&#8308;</text>
<text x="350" y="86">pH = &#8722;log [H&#8314;]</text>
<text x="350" y="112">[H&#8314;] = 10&#8315;&#7522;&#7523;</text>
</g>
<text x="350" y="146" class="f-acc f-txt" text-anchor="middle" font-size="13" font-weight="700">Worked: a solution has pH 3.</text>
<g class="f-txt" font-size="12.5">
<text x="80" y="170">[H&#8314;] = 10&#8315;&#179; M &#8212; just flip the sign of the pH</text>
<text x="80" y="190">[OH&#8315;] = 10&#8315;&#185;&#8308; &#247; 10&#8315;&#179; = 10&#8315;&#185;&#185; M &#8212; subtract the exponents</text>
<text x="80" y="210">Check: &#8722;3 + &#8722;11 = &#8722;14 &#10003; the two exponents ALWAYS add to &#8722;14</text>
</g>
<text x="350" y="240" class="f-sm" text-anchor="middle">Going from pH 4 to pH 6 is 2 units, so [H&#8314;] changed by 10&#178; = 100&#215;, and it DECREASED because pH went up.</text>
</svg>`;

FIG.bicarb = `<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The bicarbonate buffer equation">
<text x="350" y="22" class="f-txt" text-anchor="middle" font-size="14" font-weight="700">The blood buffer equation he put on a slide</text>
<text x="350" y="62" class="f-txt" text-anchor="middle" font-size="17" font-weight="700">CO&#8322; + H&#8322;O &#8652; H&#8322;CO&#8323; &#8652; HCO&#8323;&#8315; + H&#8314;</text>
<g class="s-acc" stroke-width="2.5" fill="none" marker-end="url(#arB)"><line x1="240" y1="92" x2="150" y2="92"/></g>
<defs><marker id="arB" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" class="f-acc"/></marker></defs>
<text x="330" y="97" class="f-acc f-txt" font-size="12.5" font-weight="700">blood gets ACIDIC (extra H&#8314;) &#8594; shifts LEFT</text>
<text x="180" y="122" class="f-sm" text-anchor="middle" font-size="11.5">H&#8314; gets mopped up into H&#8322;CO&#8323;</text>
<g class="s-alt" stroke-width="2.5" fill="none" marker-end="url(#arB2)"><line x1="440" y1="152" x2="560" y2="152"/></g>
<defs><marker id="arB2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" class="f-alt"/></marker></defs>
<text x="330" y="157" class="f-alt f-txt" font-size="12.5" font-weight="700" text-anchor="end">blood gets BASIC &#8594; shifts RIGHT</text>
<text x="560" y="176" class="f-sm" text-anchor="middle" font-size="11.5">H&#8314; is released back</text>
<text x="350" y="206" class="f-sm" text-anchor="middle">Net effect either way: pH is pulled back toward 7.35 to 7.45. Below 7.35 is acidosis, above 7.45 is alkalosis. Past 6.8 or 8.0, death.</text>
</svg>`;

FIG.proVsEu = `<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prokaryotic versus eukaryotic cells">

<text x="521" y="164" class="f-sm" text-anchor="middle" font-size="10.5">membrane-bound organelles</text>
<g class="f-txt" font-size="12">
<text x="30" y="156">&#183; No nucleus, DNA loose in cytoplasm</text>

<text x="372" y="226">&#183; Larger, 10&#8211;100 &#181;m</text>
<text x="372" y="244" class="f-sm">&#183; Animals, plants, fungi, protists</text>
</g>
<text x="350" y="258" class="f-sm" text-anchor="middle" font-size="11">BOTH have: plasma membrane &#183; protoplasm (cytoplasm) &#183; DNA/RNA &#183; ribosomes</text>

FIG.organelles = `<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eukaryotic organelles and their jobs">
<text x="350" y="20" class="f-txt" text-anchor="middle" font-size="14" font-weight="700">The organelle roster</text>
<g class="f-none s-acc" stroke-width="1.5">
<rect x="10" y="32" width="222" height="60" rx="10"/><rect x="240" y="32" width="222" height="60" rx="10"/><rect x="470" y="32" width="220" height="60" rx="10"/>
<rect x="10" y="100" width="222" height="60" rx="10"/><rect x="240" y="100" width="222" height="60" rx="10"/><rect x="470" y="100" width="220" height="60" rx="10"/>
<rect x="10" y="168" width="222" height="60" rx="10"/><rect x="240" y="168" width="222" height="60" rx="10"/><rect x="470" y="168" width="220" height="60" rx="10"/>
</g>
<g class="f-acc f-txt" font-size="13" font-weight="700">
<text x="24" y="52">Nucleus</text><text x="254" y="52">Ribosome</text><text x="484" y="52">Rough ER</text>
<text x="24" y="120">Smooth ER</text><text x="254" y="120">Golgi apparatus</text><text x="484" y="120">Lysosome</text>
<text x="24" y="188">Mitochondrion</text><text x="254" y="188">Chloroplast</text><text x="484" y="188">Cytoskeleton</text>
</g>
<g class="f-txt" font-size="11.5">
<text x="24" y="70">houses DNA as chromatin</text><text x="24" y="86" class="f-sm">nucleolus makes ribosomes &#183; pores in envelope</text>
<text x="254" y="70">rRNA + protein complex</text><text x="254" y="86" class="f-sm">builds proteins &#183; NOT membrane bound</text>
<text x="484" y="70">ribosomes studded on it</text><text x="484" y="86" class="f-sm">makes and packages secretory proteins</text>
<text x="24" y="138">no ribosomes</text><text x="24" y="154" class="f-sm">lipid synthesis, detox, calcium storage</text>
<text x="254" y="138">modifies, sorts, ships</text><text x="254" y="154" class="f-sm">the post office of the cell</text>
<text x="484" y="138">vesicle of digestive enzymes</text><text x="484" y="154" class="f-sm">breaks down waste and worn parts</text>
<text x="24" y="206">makes ATP from food</text><text x="24" y="222" class="f-sm">own DNA &#183; folded cristae &#183; in all eukaryotes</text>
<text x="254" y="206">photosynthesis</text><text x="254" y="222" class="f-sm">own DNA &#183; plants and algae only</text>
<text x="484" y="206">microtubules + microfilaments</text><text x="484" y="222" class="f-sm">shape, support, movement, flagella and cilia</text>
</g>
<text x="350" y="252" class="f-acc f-txt" text-anchor="middle" font-size="12.5" font-weight="700">Plant cells also have: cell wall, central vacuole, chloroplasts</text>
<text x="350" y="274" class="f-sm" text-anchor="middle">Animal cells have: centrioles, lysosomes, and usually no wall or large vacuole</text>
<text x="350" y="294" class="f-sm" text-anchor="middle">Internal membranes do two things: compartmentalize the cell, and increase surface area for metabolism.</text>
</svg>`;

FIG.endomembrane = `<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Path of a secreted protein through the endomembrane system">

FIG.alphaBeta = `<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alpha versus beta glucose">

<text x="520" y="56" class="f-acc f-txt" text-anchor="middle" font-size="14" font-weight="700">BETA (&#946;) glucose</text>
<path d="M150 76 l30 -14 l30 14 v30 l-30 14 l-30 -14 z" class="f-pale s-line" stroke-width="1.8"/>
<path d="M490 76 l30 -14 l30 14 v30 l-30 14 l-30 -14 z" class="f-pale s-line" stroke-width="1.8"/>

<text x="468" y="62" class="f-acc f-txt" font-size="10.5" font-weight="700">OH up</text>
<g class="f-txt" font-size="12">
<text x="228" y="90">Starch: 1-4 links, coiled</text>

FIG.rGroups = `<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The categories of amino acid R groups">

 why:"Both contain phosphate and adenine. The RNA-only features are uracil, ribose, and single-stranded structure."},
{deck:"macro", type:"mc", q:"Which macromolecule class is NOT a true polymer?",
 opts:["Carbohydrates","Lipids","Proteins","Nucleic acids"], a:1,
 why:"Lipids are not built from repeating identical monomers strung into a chain. They are grouped together by being hydrophobic, not by a shared building block."},
{deck:"macro", type:"sa", q:"Explain the four levels of protein structure and what stabilizes each.",
 model:"Primary structure is the linear sequence of amino acids joined by peptide bonds, determined by the gene. Secondary structure is local folding into alpha helices and beta pleated sheets, stabilized by hydrogen bonds between atoms of the backbone rather than the R groups. Tertiary structure is the overall three-dimensional shape of the whole polypeptide, stabilized by interactions between R groups including hydrophobic clustering, hydrogen bonds, ionic bonds, and covalent disulfide bridges. Quaternary structure is the assembly of two or more separate polypeptide chains into one functional protein, as in hemoglobin's four subunits, and not every protein has it."},
{deck:"macro", type:"sa", q:"Explain how the structure of DNA makes accurate inheritance possible.",
 model:"DNA is a double helix with a sugar-phosphate backbone on the outside and bases pointing inward. Because adenine always pairs with thymine and guanine always pairs with cytosine, the sequence of one strand exactly specifies the sequence of the other. That means when the two strands separate, each one serves as a template for building a new complementary partner, producing two identical double helices. The complementary base pairing is what makes the copying accurate, so the structure of the molecule is the direct reason inheritance works."},
{deck:"macro", type:"sa", q:"Explain why a phospholipid bilayer forms spontaneously in water.",
 model:"A phospholipid is amphipathic: its phosphate head is polar and hydrophilic while its two fatty acid tails are nonpolar and hydrophobic. In water, the hydrophilic heads form favorable interactions with the surrounding water while the hydrophobic tails cannot, so the tails cluster together to minimize contact with water. The most stable arrangement is a double layer with heads facing outward into the water on both sides and tails sequestered in the interior. Nothing assembles it deliberately; the hydrophobic effect makes this the lowest-energy arrangement, and the resulting bilayer is what allows a cell to exist as a separate compartment."},

/* ---- viruses ---- */
{deck:"virus", type:"mc", q:"Which structure do ALL viruses have?",
 opts:["An envelope","Glycoprotein spikes","A capsid surrounding nucleic acid","Ribosomes"], a:2,
 why:"Envelopes and spikes are optional, and no virus has ribosomes. Genome plus capsid is the universal minimum."},
{deck:"virus", type:"mc", q:"A viral envelope is made of:",
 opts:["Protein subunits made by the virus","Lipid membrane taken from the host cell","Carbohydrate","Nucleic acid"], a:1,
 why:"It is stolen host membrane, which is lipid. That is exactly why soap, which disrupts lipids, destroys enveloped viruses."},
{deck:"virus", type:"mc", q:"Viruses infect only specific host cells because:",
 opts:["They can only survive at certain temperatures","Their attachment proteins must physically match a specific host receptor","They only infect weakened cells","They are too large for most cells"], a:1,
 why:"Key and lock. No matching receptor means no attachment and no entry, which is why host range is narrow."},
{deck:"virus", type:"mc", q:"Which step of viral replication is impossible without a host cell?",
 opts:["Attachment","Replication and protein synthesis","Existing as a particle","Being detected by a microscope"], a:1,
 why:"Viruses have no ribosomes, no metabolic enzymes, and no ATP. Every bit of the manufacturing is borrowed, and that is the core argument against them being alive."},
{deck:"virus", type:"mc", q:"RNA viruses mutate rapidly primarily because:",
 opts:["They replicate slowly","Their polymerase lacks proofreading ability","They have larger genomes","They have envelopes"], a:1,
 why:"No proofreading means errors stay in. Combined with huge numbers of copies, variants appear fast, which is why flu shots are reformulated yearly."},
{deck:"virus", type:"sa", q:"Are viruses alive? Build a full answer using the characteristics of life.",
 model:"Viruses fail most of the standard criteria for life. They are acellular, so they violate cell theory. They have no metabolism, no ribosomes, and cannot produce ATP, so they cannot process energy. They do not maintain homeostasis or grow and develop. They can only reproduce by entering a host cell and hijacking its machinery, so reproduction is not independent. However, they do possess genetic material in the form of DNA or RNA, and they clearly mutate and undergo natural selection, as seen with new influenza and coronavirus variants. Because they meet only the heredity and evolution criteria, most biologists describe viruses as existing at the border of life, or as alive only while inside a host cell. The deciding property is the inability to reproduce or metabolize independently."},
{deck:"virus", type:"sa", q:"Walk through the replication cycle of an RNA virus and name the host component used at each step.",
 model:"First, attachment: a glycoprotein spike on the virus binds a specific receptor protein on the host cell surface. Second, entry and uncoating: the virus enters the cell and the capsid comes off, releasing the RNA genome into the cytoplasm. Third, replication and biosynthesis: the host cell's ribosomes, amino acids, and ATP are used to translate viral proteins, while viral RNA polymerase copies the genome. Fourth, assembly: newly made capsid proteins package copies of the genome into new virions. Fifth, release: new viruses either bud out through the host membrane, taking an envelope with them, or burst the cell open by lysis. The virus supplies only the instructions; the ribosomes, energy, and raw materials are all the host's."}
];

{deck:"macro", type:"sa", q:"State the general rule linking linkage type, chain shape and function in polysaccharides.",

let pomFocus = 25, pomBreak = 5;
let pomLeft = 25*60, pomTotal = 25*60, pomRunning = false, pomOnBreak = false, pomTick = null;
const POM_PRESETS = [[10,2],[15,3],[20,5],[25,5],[30,10],[45,15],[50,10],[60,15]];

function togglePom(){ document.getElementById("pomPanel").classList.toggle("open"); }
function pomFmt(s){ const m = Math.floor(s/60), r = s%60; return m + ":" + String(r).padStart(2,"0"); }
function pomPaint(){
  const arc = document.getElementById("pomArc");
  const frac = pomTotal ? pomLeft/pomTotal : 0;
  arc.setAttribute("stroke-dashoffset", String(327 * (1 - frac)));
  arc.setAttribute("stroke", pomOnBreak ? "var(--lavender)" : "var(--rose)");
  document.getElementById("pomTime").textContent = pomFmt(pomLeft);
  document.getElementById("pomBerry").textContent = pomOnBreak ? "🫖" : "🍓";
  document.getElementById("pomState").textContent = pomOnBreak
    ? pomBreak + " minute break" : pomFocus + " minutes, then a break";
  document.getElementById("pomGo").textContent = pomRunning ? "Pause" : (pomLeft === pomTotal ? "Start" : "Resume");
  const lbl = document.getElementById("pomLabel");
  lbl.textContent = (pomRunning || pomLeft !== pomTotal) ? pomFmt(pomLeft) : "Timer";
  document.getElementById("pomBtn").querySelector(".berry").textContent = pomOnBreak ? "🫖" : "🍓";
}
function paintPresets(){
  document.querySelectorAll(".pom-row button[data-f]").forEach(b => {
    b.classList.toggle("on", +b.dataset.f === pomFocus && +b.dataset.b === pomBreak);
  });
  const f = document.getElementById("pomFocusN"), b = document.getElementById("pomBreakN");
  if(f) f.textContent = pomFocus;
  if(b) b.textContent = pomBreak;
}
function pomPreset(f, b){
  pomFocus = f; pomBreak = b; pomOnBreak = false;
  pomStop(); pomTotal = f*60; pomLeft = pomTotal;
  store.set("pom", [f,b]);
  paintPresets();
  document.getElementById("pomMsg").textContent = "";
  document.getElementById("pomPanel").classList.remove("done");
  pomPaint();
}
function pomNudge(which, delta){
  if(which === "f") pomFocus = Math.min(120, Math.max(1, pomFocus + delta));
  else pomBreak = Math.min(60, Math.max(1, pomBreak + delta));
  pomPreset(pomFocus, pomBreak);
}
function buildPresets(){
  const cell = ([f,b]) => `<button data-f="${f}" data-b="${b}" onclick="pomPreset(${f},${b})">${f}/${b}</button>`;
  document.getElementById("pomPresets").innerHTML =
    `<div class="pom-row">${POM_PRESETS.slice(0,4).map(cell).join("")}</div>
     <div class="pom-row">${POM_PRESETS.slice(4).map(cell).join("")}</div>
     <div class="pom-row custom">
       <button onclick="pomNudge('f',-5)">&#8722;</button>
       <span>focus <b id="pomFocusN">25</b>m</span>
       <button onclick="pomNudge('f',5)">+</button>
       <button onclick="pomNudge('b',-1)">&#8722;</button>
       <span>break <b id="pomBreakN">5</b>m</span>
       <button onclick="pomNudge('b',1)">+</button>
     </div>`;
  const saved = store.get("pom", null);
  if(saved){ pomFocus = saved[0]; pomBreak = saved[1]; pomTotal = pomFocus*60; pomLeft = pomTotal; }
  paintPresets();
}
function pomStop(){ pomRunning = false; if(pomTick){ clearInterval(pomTick); pomTick = null; } }
function pomStart(){
  if(pomRunning){ pomStop(); pomPaint(); return; }
  primeChime();
  document.getElementById("pomPanel").classList.remove("done");
  document.getElementById("pomMsg").textContent = "";
  pomRunning = true;
  pomTick = setInterval(() => {
    pomLeft--;
    if(pomLeft <= 0){ pomStop(); pomFinish(); }
    pomPaint();
  }, 1000);
  pomPaint();
}
function pomSkip(){ pomStop(); pomFinish(); }
function pomReset(){
  pomStop(); pomOnBreak = false; pomTotal = pomFocus*60; pomLeft = pomTotal;
  document.getElementById("pomMsg").textContent = "";
  document.getElementById("pomPanel").classList.remove("done"); pomPaint();
}
function pomFinish(){
  chime();
  const panel = document.getElementById("pomPanel");
  panel.classList.add("open","done");
  if(!pomOnBreak){
    pomOnBreak = true; pomTotal = pomBreak*60; pomLeft = pomTotal;
    document.getElementById("pomMsg").textContent = "Nice work. Stretch, drink water 🍓";
  } else {
    pomOnBreak = false; pomTotal = pomFocus*60; pomLeft = pomTotal;
    document.getElementById("pomMsg").textContent = "Break is over whenever you are ready";
  }
  pomPaint();
}
/* a soft three-note chime, slow swell and long fade, nothing that jolts you */
let audioCtx = null;
function primeChime(){
  try{ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
       if(audioCtx.state === "suspended") audioCtx.resume(); }catch(e){}
}
function chime(){
  try{
    primeChime(); if(!audioCtx) return;
    const now = audioCtx.currentTime;
    [587.33, 783.99, 1046.50].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      const t = now + i * 0.42;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.10, t + 0.30);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 2.0);
    });
  }catch(e){}
}

      <div class="panel deep">
        <span class="dt">A HARDER VERSION OF THIS QUESTION</span><p>${dp.harder}</p>
        ${dp.field ? `<span class="dt">WHY IT MATTERS IN PATHOLOGY</span><p>${dp.field}</p>` : ""}
        ${dp.later ? `<span class="dt">WHAT IT SETS UP LATER</span><p>${dp.later}</p>` : ""}
      </div>
    </div>` : "";
  const rel = linksFor(d.id, cardIndex);
  const relHtml = rel.length ? `<div class="links"><span class="t">WHILE YOU ARE HERE</span>` +
    rel.map(r => {
      const td = DECKS.find(x=>x.id===r.deck); const tc = td.cards[r.card];
      return `<button onclick="jumpTo('${r.deck}',${r.card})"><b>${tc.icon} ${tc.q}</b><br>${r.why}</button>`;
    }).join("") + `</div>` : "";
  return `
    <div class="dots">${dots}</div>
    <article class="card">
      <div class="cardtop">
        <span class="em">${c.icon}</span>
        <span class="src ${c.src === "guide" ? "guide" : "lec"}">${c.src === "guide" ? "reading guide" : "in lecture"}</span>
      </div>
      <h3>${c.q}</h3>
      <div class="cardgrid ${(c.fig||c.fig2)?'has-fig':'solo'}">
      <div class="colA">${figFor(c.fig)}${figFor(c.fig2)}</div>
      <div class="colB">
      <div class="answer"><span class="t">IN PLAIN WORDS</span><p>${c.plain}</p></div>
      <div class="more open" id="m1">
        <button onclick="toggle('m1')">How to say it on the exam <span class="plus">&#8722;</span></button>
        <div class="panel">${c.sci}</div>
      </div>
      <div class="more open" id="m2">
        <button onclick="toggle('m2')">Memory trick <span class="plus">&#8722;</span></button>
        <div class="panel trick">${c.trick}</div>
      </div>
      <div class="aloud"><b>SAY IT OUT LOUD</b>${c.aloud}</div>
      <div class="mark">
        <button class="${mine==='got'?'sel-got':''}" onclick="setMark('${d.id}',${cardIndex},'got')">I've got this</button>
        <button class="${mine==='shaky'?'sel-shaky':''}" onclick="setMark('${d.id}',${cardIndex},'shaky')">Still shaky</button>
      </div>
      ${deepHtml}
      ${relHtml}
      </div>
      </div>
    </article>
    <div class="nav">
      <button onclick="goCard(${cardIndex-1})" ${cardIndex===0?"disabled":""}>← Back</button>
      <span class="count">${cardIndex+1} / ${d.cards.length}</span>
      <button class="primary" onclick="goCard(${cardIndex+1})">${cardIndex+1===d.cards.length?"Finish":"Next →"}</button>
    </div>`;
}
function jumpTo(dId, idx){
  deckId = dId; cardIndex = idx; mode = "read";
  ["read","flip","quiz","weak","plan"].forEach(x => document.getElementById("m-"+x).setAttribute("aria-selected", String(x==="read")));
  store.set("deck", dId); renderDecks(); render();
  scrollToContent();
}
function toggle(id){
  const el = document.getElementById(id);
  el.classList.toggle("open");
  el.querySelector(".plus").textContent = el.classList.contains("open") ? "−" : "+";
}
function renderDone(){
  const d = deck();
  const next = DECKS[DECKS.findIndex(x => x.id === deckId) + 1];
  return `<div class="cover">
    <span class="em">🍓</span>
    <h2>${d.name}, done</h2>
    <p style="color:var(--text-mid);margin:6px 0 20px">All ${d.cards.length} cards. Now test it, because reading it and being able to say it are two different things.</p>
    <button class="btn" onclick="setMode('quiz')">Quiz me on this section</button>
    <div style="margin-top:12px">
      <button class="btn ghost" onclick="goCard(0)">Go through it again</button>
    </div>
    ${next ? `<div style="margin-top:12px"><button class="btn ghost" onclick="setDeck('${next.id}')">Next up: ${next.name} →</button></div>` : ""}
  </div>`;
}

/* ---------- FLASHCARDS ---------- */
function renderFlip(){
  const cards = deck().cards;
  if(flipIndex >= cards.length) flipIndex = 0;
  const c = cards[flipIndex];
  return `
    <p class="hint">Answer out loud first, then tap to flip 🍓</p>
    <div class="flipwrap">
      <div class="flip ${flipped?'flipped':''}" id="flipcard" onclick="doFlip()" tabindex="0"
        onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();doFlip();}">
        <div class="face front"><div class="front-q"><div><div style="font-size:30px;margin-bottom:10px">${c.icon}</div>${c.q}</div></div></div>
        <div class="face back">
          ${figFor(c.fig)}
          <div class="mini"><b>IN PLAIN WORDS</b>${c.plain}</div>
          <div class="mini"><b>EXAM WORDING</b>${c.sci}</div>
          <div class="mini"><b>MEMORY TRICK</b>${c.trick}</div>
        </div>
      </div>
    </div>
    <div class="nav">
      <button onclick="stepFlip(-1)">← Back</button>
      <span class="count">${flipIndex+1} / ${cards.length}</span>
      <button class="primary" onclick="stepFlip(1)">Next →</button>
    </div>`;
}
function doFlip(){ flipped = !flipped; const el = document.getElementById("flipcard"); if(el) el.classList.toggle("flipped", flipped); }
function stepFlip(n){ const cards = deck().cards; flipped = false; flipIndex = (flipIndex+n+cards.length)%cards.length; render(); }

/* ---------- QUIZ ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function startQuiz(list){
  quizPicked = true;
  quizList = list || shuffle(QUIZ.filter(q => q.deck === deckId));
  quizIndex = 0; quizAnswered = false; quizMissed = []; quizRight = 0; render();
}
function figForQuestion(q){
  const d = DECKS.find(x => x.id === q.deck);
  if(!d) return "";
  const words = q.q.toLowerCase();
  const hit = d.cards.find(c => c.fig && c.q.toLowerCase().split(/\W+/).filter(w=>w.length>5)
    .some(w => words.includes(w)));
  return hit ? figFor(hit.fig) : "";
}

function renderQuizPicker(){
  const d = deck();
  const sectionCount = QUIZ.filter(q => q.deck === deckId).length;
  const pool = adaptivePool();
  const shaky = shakyCards().length;
  return `<div class="cover" style="text-align:left">
    <div style="text-align:center"><span class="em">📝</span>
    <h2 style="text-align:center">What should I quiz you on?</h2>
    <p class="meta" style="text-align:center">You are in ${COVERS[d.id].em} ${d.name}. Switch sections with the chips above.</p></div>
    <button class="pick" onclick="startQuiz()">
      <b>This section</b><small>${sectionCount} questions from ${d.name}</small></button>
    <button class="pick ${pool.length?'':'off'}" ${pool.length?'':'disabled'} onclick="startAdaptive()">
      <b>Just my weak spots</b><small>${pool.length
        ? pool.length + " question" + (pool.length===1?"":"s") + " from the " + shaky + " card" + (shaky===1?"":"s") + " you flagged and anything you have missed"
        : "Nothing flagged yet. Mark a card Still shaky in Learn and it shows up here."}</small></button>
    <button class="pick" onclick="startQuiz(shuffle(QUIZ))">
      <b>Everything in Unit 1</b><small>all ${QUIZ.length} questions, every section</small></button>
  </div>`;
}
function renderQuiz(){
  if(!quizPicked) return renderQuizPicker();
  if(!quizList.length) return `<div class="card"><p>No questions for this section yet.</p></div>`;
  if(quizIndex >= quizList.length) return renderScore();
  const q = quizList[quizIndex];
  const pct = Math.round((quizIndex/quizList.length)*100);
  const body = q.type === "mc"
    ? `<div class="opts" id="opts">${q.opts.map((o,i)=>`<button onclick="answerMC(${i})">${o}</button>`).join("")}</div><div id="verdict"></div>`
    : `<textarea id="sa" placeholder="Say it out loud, then type the short version."></textarea>
       <div style="margin-top:12px"><button class="btn" onclick="revealSA()">Show a full-credit answer</button></div><div id="verdict"></div>`;
  return `
    <div class="prog"><i style="width:${pct}%"></i></div>
    <div class="card">
      <p class="q-meta">Question ${quizIndex+1} of ${quizList.length} · ${q.type==="mc"?"Multiple choice":"Short answer"}</p>
      <p class="q-text">${q.q}</p>
      ${figForQuestion(q)}
      ${body}
    </div>
    <div class="nav">
      <button class="primary" id="nextBtn" onclick="nextQ()" ${quizAnswered?"":"disabled"}>Next question →</button>
    </div>`;
}
function answerMC(i){
  if(quizAnswered) return; quizAnswered = true;
  const q = quizList[quizIndex];
  document.querySelectorAll("#opts button").forEach((b,ix) => {
    b.disabled = true;
    if(ix === q.a) b.classList.add("right"); else if(ix === i) b.classList.add("wrong");
  });
  const ok = i === q.a;
  if(ok) quizRight++; else { quizMissed.push(q); rememberMissed(q); }
  document.getElementById("verdict").innerHTML =
    `<div class="verdict ${ok?'ok':'no'}"><b>${ok?'Correct 🍓':'Not this time.'}</b>${q.why}</div>`;
  document.getElementById("nextBtn").disabled = false;
}
function revealSA(){
  if(quizAnswered) return; quizAnswered = true;
  const q = quizList[quizIndex];
  document.getElementById("verdict").innerHTML = `
    <div class="model"><b>WHAT A FULL-CREDIT ANSWER SOUNDS LIKE</b>${q.model}</div>
    <div class="selfmark">
      <button onclick="markSA(true)">I covered that</button>
      <button onclick="markSA(false)">I missed parts</button>
    </div>`;
  document.getElementById("nextBtn").disabled = false;
}
function markSA(ok){
  const q = quizList[quizIndex];
  if(ok) quizRight++; else { quizMissed.push(q); rememberMissed(q); }
  document.querySelector(".selfmark").innerHTML =
    `<p style="margin:0;color:var(--text-soft);font-size:14.5px">${ok?"Logged as known.":"Added to your redo list."}</p>`;
}
function nextQ(){ quizIndex++; quizAnswered = false; render(); scrollToContent(); }
function renderScore(){
  const total = quizList.length, pct = total?Math.round(quizRight/total*100):0;
  const note = pct>=90 ? "You are ready. Skim the misses and go to sleep."
    : pct>=70 ? "Solid. Redo the misses, then say those cards out loud."
    : "Go back to Learn for this section first, then come back here.";
  return `<div class="score">
    <span style="font-size:34px">${pct>=90?"🍓":pct>=70?"✨":"📖"}</span>
    <p style="color:var(--text-soft);margin:0">You scored</p>
    <p class="big">${pct}%</p>
    <p>${quizRight} of ${total} · ${note}</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      ${quizMissed.length?`<button class="btn" onclick="redoMissed()">Redo the ${quizMissed.length} I missed</button>`:""}
      <button class="btn ghost" onclick="startQuiz(quizList)">Same quiz again</button>
      <button class="btn ghost" onclick="pickAgain()">Pick a different quiz</button>
    </div>
    ${quizMissed.length?`<p style="text-align:left;margin:22px 0 8px;font-weight:700">What to review:</p>
      <ul class="missed">${quizMissed.map(q=>`<li>${q.q}</li>`).join("")}</ul>`:""}
  </div>`;
}
function pickAgain(){ quizPicked = false; render(); scrollToContent(); }
function redoMissed(){ startQuiz(shuffle(quizMissed)); }



/* ---------- adaptive quiz: pull questions attached to shaky cards ---------- */
function shakyCards(){
  const m = getMarks();
  return Object.keys(m).filter(k => m[k]==="shaky").map(k => {
    const [dId,i] = k.split(":");
    const d = DECKS.find(x=>x.id===dId); if(!d) return null;
    const c = d.cards[+i]; if(!c) return null;
    return {dId, i:+i, c, deckName:d.name};
  }).filter(Boolean);
}
function adaptivePool(){
  const shaky = shakyCards();
  const missed = getMissed();
  const pool = QUIZ.filter(q => {
    const onShaky = q.cardSub && shaky.some(s => s.dId === q.cardDeck && s.c.q.indexOf(q.cardSub) !== -1);
    const wasMissed = missed.some(m => m.q === q.q);
    return onShaky || wasMissed;
  });
  return pool;
}
function startAdaptive(){
  const pool = adaptivePool();
  if(!pool.length) return;
  mode = "quiz";
  ["read","flip","quiz","weak","plan"].forEach(x => document.getElementById("m-"+x).setAttribute("aria-selected", String(x==="quiz")));
  startQuiz(shuffle(pool));
  scrollToContent();
}

/* ---------- WEAK SPOTS ---------- */
function renderWeak(){
  const shaky = shakyCards();
  const missed = getMissed();
  const pool = adaptivePool();
  if(!shaky.length && !missed.length){
    return `<div class="empty"><span>🍓</span>
      <p>Nothing here yet. Mark a card <b>Still shaky</b> while you learn, or miss a quiz question, and it lands on this page with a quiz built from just those cards.</p>
      <p style="margin-top:14px;font-size:14.5px">Tomorrow morning, this is the only page you need to open.</p></div>`;
  }
  let html = "";
  if(pool.length){
    html += `<div class="card" style="text-align:center">
      <span style="font-size:30px">🎯</span>
      <p style="color:var(--text-mid);margin:6px 0 14px">${pool.length} question${pool.length===1?"":"s"} are attached to the cards you flagged and the questions you missed. This is your quiz, not the whole section.</p>
      <button class="btn" style="width:100%" onclick="startAdaptive()">Quiz me on my weak spots</button>
    </div>`;
  }
  if(shaky.length){
    html += `<p class="weak-h">Cards you marked shaky (${shaky.length})</p>`;
    html += shaky.map(s => `<button class="weak-item" onclick="jumpTo('${s.dId}',${s.i})">
      ${s.c.icon} ${s.c.q}<small>${s.deckName} · tap to reread</small></button>`).join("");
    html += `<button class="btn ghost" style="width:100%;margin-bottom:6px" onclick="clearMarks()">Clear these marks</button>`;
  }
  if(missed.length){
    const byDeck = {};
    missed.forEach(m => { (byDeck[m.deck] = byDeck[m.deck] || []).push(m); });
    html += `<p class="weak-h">Quiz questions you missed (${missed.length})</p>`;
    html += missed.map(m => {
      const d = DECKS.find(x=>x.id===m.deck);
      return `<div class="weak-item" style="cursor:default">${m.q}<small>${d?d.name:""}</small></div>`;
    }).join("");
    html += `<button class="btn ghost" style="width:100%;margin-bottom:8px" onclick="quizMissedSaved()">Redo only the missed questions</button>`;
    html += `<button class="btn ghost" style="width:100%" onclick="clearMissed()">Clear the missed list</button>`;
  }
  return html;
}
function quizMissedSaved(){
  const missed = getMissed();
  const list = QUIZ.filter(q => missed.some(m => m.q === q.q));
  if(!list.length) return;
  mode = "quiz";
  ["read","flip","quiz","weak","plan"].forEach(x => document.getElementById("m-"+x).setAttribute("aria-selected", String(x==="quiz")));
  startQuiz(shuffle(list));
  scrollToContent();
}


/* ---------- swipe between cards ---------- */
let touchX = 0, touchY = 0;
function attachSwipe(){
  const v = document.getElementById("view");
  v.ontouchstart = e => { touchX = e.changedTouches[0].clientX; touchY = e.changedTouches[0].clientY; };
  v.ontouchend = e => {
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    if(Math.abs(dx) < 55 || Math.abs(dy) > 45) return;
    if(mode === "read" && cardIndex >= 0){
      if(dx < 0) goCard(cardIndex + 1);
      else if(cardIndex > 0) goCard(cardIndex - 1);
    } else if(mode === "flip"){
      stepFlip(dx < 0 ? 1 : -1);
    }
  };
}


/* ---------- picture sheet: every diagram in a section, no words ---------- */
let sheetDeck = null;
function openSheet(dId){
  sheetDeck = dId; mode = "sheet";
  ["read","flip","quiz","weak","plan"].forEach(x => document.getElementById("m-"+x).setAttribute("aria-selected","false"));
  render(); scrollToContent();
}
function renderSheet(){
  const d = DECKS.find(x => x.id === sheetDeck);
  if(!d) return "";
  const keys = [];
  d.cards.forEach(c => { [c.fig, c.fig2].forEach(k => { if(k && FIG[k] && keys.indexOf(k) === -1) keys.push(k); }); });
  return `<div class="cover" style="margin-bottom:14px">
      <span class="em">${COVERS[d.id].em}</span>
      <h2>${d.name}</h2>
      <p class="meta">${keys.length} diagrams, no text. Scroll through and name each part as it goes by.</p>
      <button class="btn ghost" onclick="setMode('plan')">Back to the plan</button>
    </div>` +
    keys.map(k => `<div class="sheetfig">${FIG[k]}</div>`).join("");
}

/* ---------- the last hour plan ---------- */
const LIKELY_SA = [
  "A Mars rover returns objects that look like microbes",
  "Given CO2 + H2O in equilibrium",
  "Trace a newly synthesized protein from synthesis to secretion",
  "A volume of water has a pH of 3",
  "Explain how a single amino acid change causes sickle cell anemia"
];
function likelyList(){
  return LIKELY_SA.map(sub => QUIZ.find(q => q.q.indexOf(sub.slice(0,42)) !== -1)).filter(Boolean);
}
function quizLikely(){
  const list = likelyList();
  if(!list.length) return;
  mode = "quiz";
  ["read","flip","quiz","weak","plan"].forEach(x => document.getElementById("m-"+x).setAttribute("aria-selected", String(x==="quiz")));
  startQuiz(list);
  scrollToContent();
}
function renderPlan(){
  const pool = adaptivePool();
  const likely = likelyList();
  return `<div class="cover" style="margin-bottom:16px">
      <span class="em">⏰</span>
      <h2>Before the exam</h2>
      <p style="color:var(--text-mid);margin-top:8px">Three things, in this order. Nothing new, no rereading the whole guide.</p>
    </div>

    <div class="plan-step">
      <span class="n">FIRST</span>
      <h4>Look at the pictures</h4>
      <p>Every diagram from a section, no words. Name the parts out loud as you scroll.</p>
      <button class="btn" onclick="openSheet('chem')">Chemistry &amp; water diagrams</button>
      <button class="btn" onclick="openSheet('macro')">Macromolecule diagrams</button>
      <button class="btn" onclick="openSheet('cells')">Cell diagrams</button>
    </div>

    <div class="plan-step">
      <span class="n">THEN</span>
      <h4>Quiz yourself</h4>
      <p>${pool.length
        ? "Just the " + pool.length + " question" + (pool.length===1?"":"s") + " tied to what you flagged and what you have missed."
        : "Pick a section and let the quiz find your gaps."}</p>
      ${pool.length
        ? `<button class="btn" onclick="startAdaptive()">Quiz my weak spots</button>`
        : `<button class="btn" onclick="setMode('quiz')">Start a quiz</button>`}
    </div>

    <div class="plan-step">
      <span class="n">LAST</span>
      <h4>Say these five out loud</h4>
      <p>The most likely short answer questions. Out loud, in full sentences, before you check.</p>
      ${likely.map(q => `<div class="plan-q">${q.q}</div>`).join("")}
      <button class="btn" onclick="quizLikely()">Practice these five</button>
    </div>

    <div class="cover" style="text-align:center">
      <span class="em">🍓</span>
      <p style="color:var(--text-mid)">Then stop. Eat something and go in.</p>
    </div>`;
}

/* ---------- render ---------- */
function render(){
  document.getElementById("view").innerHTML =
    mode==="read" ? renderRead() : mode==="flip" ? renderFlip() : mode==="weak" ? renderWeak()
    : mode==="plan" ? renderPlan() : mode==="sheet" ? renderSheet() : renderQuiz();
  attachSwipe();
}
document.addEventListener("keydown", e => {
  if(mode==="flip"){ if(e.key==="ArrowRight") stepFlip(1); if(e.key==="ArrowLeft") stepFlip(-1); }
  else if(mode==="read" && cardIndex>=0){
    if(e.key==="ArrowRight") goCard(cardIndex+1);
    if(e.key==="ArrowLeft" && cardIndex>0) goCard(cardIndex-1);
  }
});
const savedDeck = store.get("deck", null);
if(savedDeck && DECKS.some(d=>d.id===savedDeck)) deckId = savedDeck;
renderDecks();
render();
</script>
</body>
</html>
