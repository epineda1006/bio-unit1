["chem","actually calculate pH","sa","A volume of water has a pH of 3. Give [H+] and [OH-], and show your reasoning.",
 null,null,null,
 "pH is the negative log of the hydrogen ion concentration, so a pH of 3 means [H+] equals 10^-3 M. In any aqueous solution the ion product of water holds: [H+] times [OH-] equals 10^-14. So [OH-] equals 10^-14 divided by 10^-3, which is 10^-11 M. A quick check: the two exponents must always sum to -14, and -3 plus -11 equals -14. Since [H+] is much larger than [OH-], the solution is acidic, which is consistent with a pH below 7."],
["chem","bicarbonate equation","sa","Given CO2 + H2O in equilibrium with H2CO3 in equilibrium with HCO3- + H+, what happens if blood pH begins to drop?",
 null,null,null,
 "A drop in pH means the hydrogen ion concentration is rising, so there is excess H+ on the right side of the equation. The equilibrium shifts to the left, away from the excess: hydrogen ions combine with bicarbonate to form carbonic acid, which can further convert to carbon dioxide and water. This removes free hydrogen ions from the blood. The net effect is that pH rises back toward the normal range of 7.35 to 7.45. This works because the system is built from a weak acid and its conjugate base, so the reaction can run in both directions. Excess carbon dioxide can then be exhaled by the lungs."],
["chem","four properties of water","mc","Santa Barbara sits at 73 degrees while Palm Springs hits 106 on the same day. This is evidence of water's:",

["macro","four levels of protein structure","sa","Explain how a single amino acid change causes sickle cell anemia, level by level.",
 null,null,null,
 "A single base change in the DNA alters the primary structure of hemoglobin, substituting valine for glutamic acid at one position. Glutamic acid is charged and hydrophilic while valine is nonpolar and hydrophobic, so that one residue now behaves completely differently during folding. This changes the R group interactions that maintain tertiary structure, and it creates a hydrophobic patch on the protein surface. Hemoglobin molecules then stick to one another and polymerize into fibers, which distorts the red blood cell into a rigid sickle shape. Those cells block capillaries and are destroyed early, causing pain crises and anemia. The chain is primary structure to tertiary structure to function to disease, and it is why sequence matters."],

["cells","Trace a protein through the endomembrane","sa","Trace a newly synthesized protein from synthesis to secretion, then say how a lysosomal protein differs.",
 null,null,null,
 "The gene is transcribed into mRNA in the nucleus, and the mRNA exits through a nuclear pore. Ribosomes bound to the rough endoplasmic reticulum translate the mRNA, and the growing protein enters the ER lumen where it is folded and modified. The rough ER buds off a transport vesicle containing the protein. That vesicle travels to and fuses with the Golgi apparatus, where the protein is further modified, sorted, and tagged for its destination. The Golgi then packages it into a secretory vesicle, which travels to the plasma membrane and fuses with it, releasing the protein outside the cell by exocytosis. A lysosomal protein follows the identical path up to the Golgi. The difference is at the sorting step: the Golgi tags it for delivery to a lysosome rather than for export, so the vesicle fuses with a lysosome and the enzyme stays inside the cell."],

/* === Big Ideas === */
["science","six concepts that organize","Pick any topic from this unit and place it under one of the six organizing concepts. Explain the fit.",
 "Take the phospholipid bilayer. It belongs under structure relates to function, because the molecule's shape is the entire reason a membrane exists: the phosphate head is hydrophilic and the two fatty acid tails are hydrophobic, so in water the molecules arrange themselves into a double layer with heads facing out and tails hidden inside. That arrangement creates a barrier separating inside from outside, which is what makes a cell a distinct compartment. It also touches organization and emergence, because a single phospholipid is not a barrier; the barrier only appears once many of them assemble. Being able to name which concept a topic belongs to, and why, is what these six ideas are for."],

["science","construct a graph from your own data","You measure sunflower height at seven different soil pH values. Describe the graph you would build.",
 "Soil pH goes on the x-axis, because that is the independent variable I deliberately changed, labeled with units as pH. Average plant height goes on the y-axis, because that is the dependent variable I measured, labeled in centimeters. I would use a line graph rather than a bar graph, because pH is a continuous variable and I want to show how height changes across the range rather than compare separate categories. The scale on each axis must use even intervals, so pH steps of 0.2 are spaced equally and height is spaced equally, since uneven spacing distorts the shape. I would add error bars to show the variation among plants within each pH group, because a difference between two groups means little if their error bars overlap heavily. Finally I would give it a descriptive title stating what is plotted against what."],

["science","critique somebody else","A friend says a supplement works because she felt better after taking it for a week. Critique that as an experiment.",
 "It is not an experiment at all, it is a single observation. There is no control group, so there is nothing to compare against and no way to know whether she would have felt better anyway. There is no blinding, so her expectation that the supplement would help could itself produce the feeling, which is the placebo effect. The outcome, feeling better, is self-reported and not measured, so it cannot be verified or compared. The sample size is one person. There is no replication. And many other variables changed during that week, including sleep, diet, stress and weather, any of which could explain the result. To test it properly you would need two groups assigned randomly, one receiving the supplement and one a placebo, neither knowing which, with a measurable outcome recorded before and after."],

["science","design an experiment from scratch","Design an experiment to test whether music affects studying, and name one flaw in your own design.",
 "Hypothesis: students who study with background music will recall less than students who study in silence. Independent variable: presence or absence of background music. Dependent variable: score on a recall test out of twenty. Controlled variables: the same study passage, the same twenty minutes of study time, the same room, the same time of day and the same test. Control group: the silence group. I would recruit enough participants to see a real difference, assign them randomly to the two groups, run the test identically for both, repeat the study, and decide in advance to compare the two group means. A flaw in my own design: students who normally study with music may be more comfortable in that condition regardless of whether music helps, and random assignment spreads that out but does not eliminate it. Naming the flaw before someone else does is part of good design."],

/* === What Is Life === */
["life","properties define something as alive","A candle flame grows, consumes fuel, produces waste and responds to wind. Explain why it is not alive.",
 "It matches a few properties superficially but fails the list as a whole, and life requires the properties collectively. It is not made of cells, so it fails cellular organization outright. It has no genetic material, so nothing is inherited and there is no heredity. It does not maintain homeostasis, since it has no internal environment it regulates against external change. It does not grow and develop in the biological sense; it simply spreads as long as fuel and oxygen are available. And it does not evolve as a population through natural selection. What it does have is a chemical reaction consuming fuel and releasing energy, which superficially resembles metabolism, plus a response to its surroundings. Matching two or three properties is not enough, which is exactly why the definition of life is a collection rather than a single test."],

["life","What is homeostasis","Trace a complete homeostatic feedback loop and identify each component.",
 "Body temperature rises above the set point, which is the stimulus. Temperature receptors in the skin and in the hypothalamus detect the change, acting as the sensor. The hypothalamus acts as the control center, comparing the current value to the set point and deciding a response is needed. It signals the effectors: sweat glands begin producing sweat and blood vessels in the skin dilate. Sweat evaporating from the skin removes heat, and dilated vessels bring blood closer to the surface where heat is released. Body temperature falls back toward the set point, and once it does, the signal stops and the response shuts off. Because the response reverses the original change rather than amplifying it, this is negative feedback, and negative feedback is the basis of nearly all homeostasis."],

["life","Rank the levels of biological organization","Explain emergence using two specific levels from the organization of life.",
 "Take the cell level and the organ level. An individual cardiac muscle cell can contract, and that is essentially all it can do on its own. But millions of those cells organized into a heart produce something none of them possess individually: a pump that circulates blood through an entire body, coordinated so that chambers contract in sequence. Pumping is an emergent property, because it arises from the specific arrangement and interaction of the components rather than from any component alone. Nothing was added except organization. This is why studying a single heart muscle cell in isolation, however thoroughly, would never let you predict what a heart does, and it is why biology cannot be reduced entirely to studying parts."],

["life","Put natural selection","Explain antibiotic resistance as natural selection, and say clearly what does NOT happen.",
 "A population of bacteria already contains variation, and by chance a few individuals carry a trait that lets them survive a particular antibiotic. When the antibiotic is applied, the susceptible bacteria die and the resistant ones survive. Those survivors reproduce, and because the resistance trait is heritable, their offspring carry it too. Over a few generations the population shifts from mostly susceptible to mostly resistant. The requirements are all there: heritable variation, differential survival, reproduction, and change across generations. What does not happen is equally important. The bacteria did not develop resistance because the antibiotic was present, and no individual bacterium changed itself to survive. The variation existed beforehand, and the antibiotic simply removed everything that lacked it. Individuals do not evolve; populations do."],

["life","most fundamental unit of life","A mitochondrion has its own DNA and divides on its own. Explain why it still is not alive.",
 "It cannot survive or reproduce independently outside a host cell, which is the deciding criterion. Although it carries its own DNA and its own ribosomes and divides by a process resembling binary fission, most of the proteins it needs are encoded by genes in the cell's nucleus and delivered to it. Remove it from the cell and it cannot sustain itself. Endosymbiotic theory says it descended from a free-living bacterium that was engulfed and kept, so its ancestor was genuinely alive and independent. Over evolutionary time it transferred most of its genes to the nucleus and lost that independence. So it is a case of something that used to be alive on its own and is now a component of something else, which is why the cell rather than the organelle remains the fundamental unit of life."],

/* === Viruses === */
["virus","basic structure of a virus","Draw a virus in words: name every part and what each one does.",
 "At the center is the genetic material, either DNA or RNA, single or double stranded, which carries the instructions for making more virus. Surrounding it is the capsid, a protein shell built from repeating subunits called capsomeres, which protects the genome and gives the virion its shape, whether rod, spherical or polyhedral. Some viruses also have a viral envelope outside the capsid, which is a piece of lipid membrane taken from the host cell as the virus exits. Embedded in that envelope are proteins and glycoproteins, often called spikes, which bind specific receptors on a host cell and determine which cells the virus can infect. A single complete particle is called a virion. Size ranges from about 20 to 500 nanometers. Notice what is absent: no ribosomes, no metabolic enzymes, no ATP."],

["virus","Walk through RNA virus replication","Walk through how an RNA virus replicates and say which host components it uses at each step.",
 "Attachment: a glycoprotein spike on the virus binds a specific receptor protein on the surface of the host cell, which is why host range is narrow. Entry and uncoating: the virus enters the cell and the capsid comes apart, releasing the RNA genome into the cytoplasm. Replication and biosynthesis: the host cell's ribosomes, its supply of amino acids and its ATP are used to translate viral proteins, while a viral RNA polymerase copies the genome using the host's nucleotides. Assembly: newly made capsid proteins package copies of the genome into new virions. Release: the new viruses leave either by budding through the plasma membrane, picking up an envelope as they go, or by lysing and destroying the cell. The virus supplies instructions and, in some cases, a polymerase. Everything else, the machinery, the energy and the raw materials, belongs to the host, which is the core argument that a virus is not independently alive."],

["virus","What is a virocell","Take a position on whether viruses are alive and defend it.",
 "My position is that viruses sit at the border of life and are best described as alive only within a host cell. The case against them being alive is strong: they are acellular, so they violate cell theory outright; they have no metabolism, no ribosomes and cannot produce ATP; they do not maintain homeostasis or grow and develop; and they cannot reproduce without hijacking a host. Outside a cell a virion is chemically inert. The case for is that they carry genetic material, produce progeny, and clearly undergo mutation and natural selection, as new influenza and coronavirus variants show every year. Forterre's virocell framing strengthens the case by arguing the virion is a dormant particle like a seed, while the living form is the infected cell running viral instructions. Applying NASA's definition settles it for me: a virus undergoes Darwinian evolution, but it is not a self-sustained chemical system, so it fails one of the two requirements."],

/* === Chemistry & Water === */
["chem","four properties of water","Explain how water's polarity produces all four of its properties.",
 "Oxygen is more electronegative than hydrogen, so in each water molecule it pulls the shared electrons closer to itself. Because the molecule is bent rather than straight, those pulls do not cancel, leaving oxygen with a partial negative charge and each hydrogen with a partial positive charge. That makes water polar, and polar molecules attract one another, forming hydrogen bonds between the partial positive hydrogen of one molecule and the partial negative oxygen of another. Every property follows from that network. Sticky behavior, meaning cohesion and adhesion, is water molecules clinging to each other and to other surfaces through hydrogen bonds. High heat capacity comes from the energy required to break and re-form those bonds, so water absorbs a lot of heat with little temperature change. Water exists in three states, and in ice the hydrogen bonds lock molecules into an open lattice that is less dense than liquid, so ice floats. And it is a versatile solvent because polar and charged substances are attracted to its partial charges and get surrounded and carried into solution."],

["chem","actually calculate pH","A lake has a pH of 4. Give [H+] and [OH-], then say what happens to both if the pH rises to 6.",
 "pH equals the negative log of the hydrogen ion concentration, so a pH of 4 means [H+] equals 10 to the minus 4 molar. In any aqueous solution the ion product holds, [H+] times [OH-] equals 10 to the minus 14, so [OH-] equals 10 to the minus 10 molar. A quick check: the two exponents must sum to minus 14, and minus 4 plus minus 10 gives minus 14. If the pH rises from 4 to 6, that is two units, and because the scale is logarithmic each unit is a factor of ten, so the hydrogen ion concentration changes by a factor of 100. The direction matters: pH going up means the solution became less acidic, so [H+] decreased by 100 times, to 10 to the minus 6. Hydroxide moves the opposite way, increasing to 10 to the minus 8, since the two must still sum to minus 14."],

["chem","bicarbonate equation","Explain the bicarbonate buffer system and what happens in acidosis.",
 "The system is carbon dioxide plus water in equilibrium with carbonic acid, which is in equilibrium with bicarbonate plus a hydrogen ion. Because it is built from a weak acid and its conjugate base, the reaction can run in both directions, which is what makes buffering possible. If blood becomes more acidic, meaning hydrogen ion concentration rises, the equilibrium shifts to the left, away from the excess: hydrogen ions combine with bicarbonate to form carbonic acid and then carbon dioxide and water, removing free hydrogen ions and pulling pH back up toward normal. The carbon dioxide produced is exhaled by the lungs. If blood becomes too basic the equilibrium shifts right, releasing hydrogen ions and lowering pH. Normal blood pH is 7.35 to 7.45. Below 7.35 is acidosis and above 7.45 is alkalosis, and beyond roughly 6.8 or 8.0 the condition is fatal, largely because enzymes denature outside that range."],

["chem","What is a hydrogen bond","Explain why hydrogen bonds being weak is an advantage rather than a problem.",
 "An individual hydrogen bond is far weaker than a covalent bond, roughly a twentieth of the strength, but biology exploits that weakness deliberately. Because large numbers of them act together, they are collectively strong enough to hold the two strands of DNA together, stabilize the alpha helices and beta pleated sheets of protein secondary structure, and give water its cohesion and high heat capacity. Because each one individually is weak, they can also be broken with modest energy and re-formed afterward. That reversibility is essential: DNA has to unzip for replication and transcription, proteins have to flex to function, and water molecules have to slide past one another for water to be a liquid. If hydrogen bonds were as strong as covalent bonds, DNA could never be read, proteins would be rigid, and water would not behave as a liquid at body temperature."],

["chem","seven functional groups","Name four functional groups, their properties, and where each is found.",
 "Hydroxyl, written -OH, is polar and forms hydrogen bonds, so it increases a molecule's solubility in water; it is found in alcohols and throughout sugars. Carboxyl, written -COOH, is acidic because it donates a hydrogen ion and takes on a negative charge, which also lets it form ionic bonds; it is found in organic acids, in fatty acids, and on one end of every amino acid. Amino, written -NH2, is basic because it accepts a hydrogen ion and takes on a positive charge; it is on the other end of every amino acid. Phosphate carries four oxygens and a negative charge; it makes the head of a phospholipid polar, forms the backbone of DNA and RNA, and drives energy transfer in ATP. Sulfhydryl, written -SH, forms covalent crosslinks called disulfide bridges that lock protein tertiary structure in place. Methyl, written -CH3, is nonpolar and unreactive, acting as a tag rather than a reactive site."],

["chem","What is an ion?","Explain how an ion forms and why ions matter to your body.",
 "An atom becomes an ion by gaining or losing electrons, which leaves it with a net charge because protons and electrons are no longer equal. Losing electrons produces a positively charged cation, since the atom now has more protons than electrons; gaining electrons produces a negatively charged anion. Atoms do this to reach a full outer electron shell. Sodium has one valence electron and loses it easily, becoming Na+; chlorine has seven and gains one, becoming Cl-. The resulting opposite charges attract, and that attraction is the ionic bond. Ions matter enormously in the body: sodium and potassium gradients across cell membranes store the charge difference that becomes a nerve impulse, calcium triggers muscle contraction and builds bone, chloride maintains charge balance, and magnesium acts as a cofactor for ATP-dependent enzymes. In water, ionic compounds dissociate into separate ions, which is why these can circulate at all."],

["chem","Element vs compound vs molecule","Distinguish element, compound and molecule, and say which term is most inclusive.",
 "An element is a pure substance that cannot be broken down into simpler substances by chemical reaction, and it is defined by its proton number. A compound is a substance made of two or more different elements combined in a fixed ratio. A molecule is two or more atoms held together by covalent bonds, whether those atoms are the same element or different ones. Molecule is the most inclusive of the three as they relate to each other, because every compound held together covalently is a molecule, but not every molecule is a compound. Oxygen gas, O2, is a molecule because two atoms are bonded, but it is not a compound because both atoms are the same element. Water, H2O, is both a molecule and a compound, since it contains two different elements bonded together in a fixed ratio."],

["chem","Bohr model and count valence","Explain how valence electrons predict an atom's bonding behavior, using three examples.",
 "Electrons fill shells around the nucleus, with the first holding two and the next holding eight in biologically relevant elements. The electrons in the outermost shell are the valence electrons, and atoms tend to gain, lose or share electrons until that outer shell is full, which is the octet rule. The number of electrons an atom still needs predicts how many bonds it forms. Carbon has six electrons total, two in the first shell and four in the outer shell, so it needs four more and forms four bonds, which is exactly why it can build chains, branches and rings. Oxygen has six valence electrons and needs two more, so it forms two bonds, which is why water is H2O. Nitrogen has five and needs three, so it forms three bonds, as in ammonia. Neon already has eight, so it needs nothing and forms no bonds at all, which is why it is inert."],

["chem","What are isotopes","Explain what an isotope is and give two ways isotopes are used in biology.",
 "Isotopes are atoms of the same element that differ in their number of neutrons, so they have the same atomic number and the same chemical behavior but different mass numbers. Carbon exists as carbon-12 with six neutrons, carbon-13 with seven, and carbon-14 with eight, and all three are carbon because all three have six protons. Some isotopes are unstable and decay at a predictable rate, releasing radiation that can be detected. In medicine, radioactive isotopes are used for imaging and as tracers; a bone imaging agent containing technetium-99m concentrates in bone and reveals cancer that has spread. In ecology and archaeology, isotope ratios are used for radiometric dating, such as carbon-14 dating of once-living material, and for diet analysis, since animals fed on corn carry a higher proportion of carbon-13 in their tissues than animals eating a mixed diet."],

/* === Macromolecules === */
["macro","four levels of protein structure","Explain all four levels of protein structure and what holds each one together.",
 "Primary structure is the linear sequence of amino acids, determined by the gene and held together by peptide bonds, which are covalent. Secondary structure is local folding into alpha helices and beta pleated sheets, held together by hydrogen bonds between hydrogens and oxygens of the polypeptide backbone, not the side chains; in an alpha helix a hydrogen bond forms roughly every fourth amino acid. Tertiary structure is the overall three-dimensional shape of the whole polypeptide, held together by interactions between R groups: hydrogen bonds, hydrophobic interactions that bury nonpolar side chains in the interior, ionic bonds between charged side chains, and covalent disulfide bridges between cysteines. Quaternary structure is the assembly of two or more separate folded polypeptides into one functional protein, maintained by covalent, ionic and hydrogen bonds between subunits; hemoglobin's four chains are the standard example. Not every protein has quaternary structure."],

["macro","Dehydration synthesis vs hydrolysis","Compare dehydration synthesis and hydrolysis, and say where each happens in the body.",
 "Dehydration synthesis joins two monomers into a polymer by removing a molecule of water: a hydroxyl group comes off one monomer and a hydrogen off the other, they combine to form water, and the two monomers bond where those groups were. It requires energy and enzymes, and it is how every polymer in the body gets built, including polysaccharides joined by glycosidic bonds, polypeptides joined by peptide bonds, and nucleic acids joined by phosphodiester bonds. Hydrolysis is the exact reverse: a water molecule is added across the bond, the hydroxyl going to one fragment and the hydrogen to the other, splitting the polymer back into monomers. It releases energy. Hydrolysis is what digestion is: amylase hydrolyzes starch into sugars, protease hydrolyzes protein into amino acids, and lipase hydrolyzes fats. Polymers are too large to cross a membrane, which is why they must be cut back down to monomers before absorption."],

["macro","Starch, glycogen, and cellulose","Compare starch, glycogen and cellulose in structure and function, and explain the alpha beta rule.",
 "All three are polymers of glucose, and what separates them is the linkage and the resulting shape. Starch is the plant storage polysaccharide, built with alpha 1-4 linkages that make the chain coil into a helix, with limited branching. Glycogen is the animal storage polysaccharide, stored in liver and muscle, built with alpha 1-4 and alpha 1-6 linkages, and the 1-6 links are the branch points that make it heavily branched; more branch ends mean more places enzymes can attack at once, which lets animals mobilize glucose quickly. Cellulose is the plant structural polysaccharide of the cell wall, built with beta 1-4 linkages that keep the chain straight and unbranched so chains stack and hydrogen bond into rigid fibers. The general rule is that alpha linkages coil and serve storage while beta linkages stay straight and serve structure. Humans lack the enzyme to break beta linkages, which is why cellulose passes through as fiber while starch and glycogen are digestible."],

["macro","Structure of a triglyceride","Compare saturated and unsaturated fats in structure, physical state and health effects.",
 "A triglyceride is a glycerol backbone with three fatty acid chains attached by ester linkages formed through dehydration synthesis. Saturated fatty acids contain no carbon-carbon double bonds, meaning they are saturated with hydrogen. Without double bonds the chains stay straight, so the molecules pack closely together, and the fat is solid at room temperature; these are mostly animal fats like butter, and they are associated with raised LDL cholesterol. Unsaturated fatty acids contain one or more double bonds, and because a double bond cannot rotate, each one puts a permanent kink in the chain. Kinked chains cannot pack tightly, so the fat is liquid at room temperature; these are mostly plant oils and fish oils. Trans fats are artificially hydrogenated unsaturated fats whose double bonds are in the trans configuration and therefore do not kink, so they behave like saturated fats while being more harmful, raising LDL and also lowering HDL."],

["macro","Describe DNA's double helix","Explain the structure of DNA and how that structure makes accurate inheritance possible.",
 "DNA is a double helix of two strands running antiparallel, meaning in opposite directions. The outside of each strand is a backbone of alternating sugar and phosphate joined by covalent bonds, and the nitrogenous bases point inward toward each other. The bases pair by complementary base pairing: adenine with thymine using two hydrogen bonds, and guanine with cytosine using three. A purine, which has two rings, always pairs with a pyrimidine, which has one, so the width of the helix stays constant along its whole length. Because the pairing rules are fixed, the sequence of one strand completely specifies the sequence of the other. That is what makes accurate copying possible: the two strands separate, and each acts as a template on which a new complementary partner is assembled, producing two identical double helices. The structure of the molecule is therefore the direct reason inheritance is reliable."],

["macro","What is denaturation","Explain denaturation, its causes, and why a high fever is dangerous.",
 "Denaturation is the unfolding of a protein, meaning the loss of its secondary, tertiary and quaternary structure, without breaking the peptide bonds that hold the sequence together. Because primary structure is covalent, the amino acid sequence survives; only the folding is destroyed. The causes are changes in pH, heat, salinity and polarity, all of which disrupt the weak interactions that maintain the fold: hydrogen bonds, hydrophobic interactions and ionic bonds. Since a protein's function depends entirely on its three-dimensional shape, a denatured protein stops working. Mild denaturation can sometimes reverse, called renaturation, but severe denaturation usually causes aggregation and is irreversible, as with a fried egg. A high fever is dangerous for exactly this reason: above roughly 104 degrees Fahrenheit, the body's own enzymes begin to denature, and once enzymes lose their shape the reactions they catalyze stop, which becomes fatal as the damage spreads."],

["macro","Structure of a phospholipid","Explain why a phospholipid bilayer forms on its own in water.",
 "A phospholipid is amphipathic, meaning one molecule has two opposite personalities. Its head contains a phosphate group, which is charged and therefore hydrophilic, and its two fatty acid tails are hydrocarbon chains, which are nonpolar and therefore hydrophobic. Placed in water, the heads interact favorably with the surrounding water molecules while the tails cannot, because they cannot form hydrogen bonds. Water molecules preferentially stick to each other and to the polar heads, and in doing so they exclude the nonpolar tails, which drives the tails together. The lowest-energy arrangement that satisfies both ends at once is a double layer, with the heads facing outward into water on both surfaces and the tails sequestered in the interior away from water. Nothing assembles it deliberately; the hydrophobic effect makes this the most stable arrangement, and the resulting bilayer is what allows a cell to exist as a separate compartment."],

/* === Cells === */
["cells","cell theory","State the cell theory, say who contributed each part, and explain why the third part mattered.",
 "Cell theory has three parts. First, all living organisms are composed of one or more cells. Second, the cell is the fundamental unit of structure and function in living things. Schleiden and Schwann established both of those in 1839. Third, all cells arise from pre-existing cells through division, which Virchow added in 1855. Robert Hooke had first observed and named cells in Micrographia in 1665, but he did not formulate the theory. Virchow's addition mattered because it directly contradicted spontaneous generation, the then-common idea that living things could arise from non-living matter. If cells only come from other cells, then every cell in your body traces back through an unbroken chain of divisions to earlier cells, and ultimately to the earliest cells billions of years ago, with no gaps. It also underlies everything about growth, reproduction and disease, since cancer is fundamentally cell division escaping control."],

["cells","Prokaryotic vs eukaryotic","Compare prokaryotic and eukaryotic cells, including what they share.",
 "Prokaryotic cells lack a membrane-bound nucleus, so their DNA sits in a region of the cytoplasm rather than in a compartment, and they lack membrane-bound organelles entirely. They are structurally simple and small, roughly one to ten micrometers, and they include bacteria and archaea. Their common shapes are bacilli, which are rods, cocci, which are spheres, and spirilli, which are spirals. Their DNA is also not packaged around histone proteins. Eukaryotic cells have a true nucleus enclosed by a nuclear envelope, plus a full set of membrane-bound organelles including mitochondria, endoplasmic reticulum, Golgi apparatus and lysosomes. They are larger, roughly ten to a hundred micrometers, and more complex, and they include animals, plants, fungi and protists. What both share is important: a plasma membrane, protoplasm meaning cytoplasm, genetic material as DNA and RNA, and ribosomes, since every cell must make proteins."],

["cells","Trace a protein through the endomembrane","Trace a secreted protein through the cell and explain how a lysosomal protein differs.",
 "The gene for the protein is transcribed into messenger RNA inside the nucleus, and that mRNA leaves through a nuclear pore into the cytoplasm. Ribosomes attached to the rough endoplasmic reticulum translate it, and the growing polypeptide enters the interior of the ER where it folds and is modified. The rough ER then buds off a transport vesicle containing the finished protein. That vesicle travels to the Golgi apparatus and fuses with it. Inside the Golgi the protein is further modified, sorted, and tagged with a destination. The Golgi packages it into a secretory vesicle, which travels to the plasma membrane, fuses with it, and releases the protein outside the cell by exocytosis. A lysosomal protein takes exactly the same route as far as the Golgi. The difference is at the sorting step: the Golgi tags it for delivery to a lysosome instead of for export, so its vesicle fuses with a lysosome and the enzyme stays inside the cell."],

["cells","endosymbiosis","Explain endosymbiosis and list the evidence supporting it.",
 "Endosymbiosis proposes that mitochondria and chloroplasts began as free-living prokaryotes that were engulfed by a larger ancestral cell and not digested. The engulfed cell survived inside, continued dividing, and over evolutionary time became a permanent organelle. Mitochondria came first and are found across eukaryotes; chloroplasts came from a separate, later engulfment of a photosynthetic bacterium and are found only in plants and algae. The evidence is that these organelles still behave like the bacteria they descended from. They contain their own DNA, separate from the nucleus. They contain their own ribosomes of the prokaryotic type. They are surrounded by a double membrane, which is exactly what engulfment would produce, since the inner membrane was the bacterium's own and the outer was the host's vesicle. They are bacteria-sized. And they divide independently of the cell, by a process resembling binary fission. By contrast, the endomembrane system is thought to have arisen from infolding of the plasma membrane rather than from engulfment."],

["cells","Mitochondria, chloroplasts, lysosomes","Pick four organelles, give each one's job, and say what would go wrong without it.",
 "The nucleus houses the DNA as chromatin and controls the cell by determining which proteins get made; without it the cell would have no instructions and could not produce the proteins it needs or divide accurately. Mitochondria carry out cellular respiration and produce ATP; without them the cell would have no usable energy supply and every energy-requiring process, including transport and synthesis, would stop. The Golgi apparatus modifies, sorts and routes proteins and lipids to their destinations; without it proteins would be made but never correctly tagged or delivered, so secretion and lysosome delivery would both fail. Lysosomes contain digestive enzymes that break down waste, worn-out organelles and engulfed material; without them debris would accumulate inside the cell, which is exactly what happens in lysosomal storage diseases. Each of these serves one of the three main functions of a cell: building molecules, transforming energy and matter, or enabling division."],

["cells","Lab 4","You are given an unlabeled slide. Explain how you would decide whether it is plant, animal or bacterial.",
 "First I would check for a nucleus. If there is no visible nucleus and the cell is very small and simple, it is prokaryotic, meaning bacterial, and I would then classify its shape as bacilli if rod-shaped, cocci if spherical, or spirilli if spiral. If there is a nucleus, the cell is eukaryotic and I move to the next test. Then I would look for a cell wall, seen as a rigid straight-edged boundary rather than a flexible outline. A wall means a plant cell. Onion epidermis shows a wall, cytoplasm, nucleus and chromatin but no chloroplasts, because the epidermis is not photosynthetic. Elodea shows a wall plus green chloroplasts and a large central vacuole, which makes it unmistakably plant. If there is no wall and no chloroplasts, only a plasma membrane, cytoplasm, nucleus and chromatin, it is an animal cell, like a human cheek cell or frog blood. Cell wall and chloroplasts are the giveaways, and animal cells never have either."],

["cells","cytoskeleton","Explain what the cytoskeleton does and why chemotherapy often targets it.",
 "The cytoskeleton is the internal framework of the cell. It provides structural support, maintains cell shape, anchors organelles in position, and enables movement. Microtubules are hollow tubes of tubulin that act as tracks along which organelles and vesicles are transported, form the mitotic spindle that separates chromosomes during cell division, and make up the core of flagella and cilia. Microfilaments are thin actin polymers involved in maintaining cell shape, in cytoplasmic streaming, in amoeboid movement, and in muscle contraction alongside myosin. Many chemotherapy drugs target microtubules, either preventing them from assembling or preventing them from disassembling. Because the mitotic spindle is built from microtubules, disrupting them stops cell division, and cells that divide frequently are hit hardest, which includes cancer cells. The side effects follow from the same mechanism: hair follicles and the lining of the gut also divide rapidly, so they are damaged too."],

/* === Tutoring === */
["tutor","components of experimental design","List the components of experimental design and apply them to the sunflower experiment.",
 "The components are a testable hypothesis with a prediction, one independent variable, one dependent variable, controlled variables, a control group, adequate sample size with random assignment, replication, and a predetermined method of analysis. Applied to the sunflower contest: the hypothesis is that soil pH affects sunflower height, with the null being that it has no effect. The prediction is that plants grown near pH 6.6 to 6.8 will be tallest. The independent variable is soil pH, set at several levels. The dependent variable is average plant height in centimeters. The controlled variables are the sunflower variety, water amount, light exposure, soil type, pot size, temperature and growing period, all held identical across groups. The control group is plants grown in untreated neutral soil. I would use many plants per pH level rather than one, assign them randomly, repeat the whole experiment, and compare group means. Note that a controlled variable and a control group are not the same thing, even though both appear on the worksheet."],

["tutor","Isotope, ion, different element","Explain what varies in an isotope, an ion, and a different element, and what each change does and does not affect.",
 "An isotope varies in its number of neutrons. That changes the mass number and can change stability, since some isotopes are radioactive, but it does not change chemical behavior, because chemistry is determined by electrons. Carbon-12 and carbon-14 behave identically in reactions. An ion varies in its number of electrons. That changes the net charge and therefore how the atom interacts with others, but it does not change which element it is, because the proton count is untouched. Sodium and Na+ are both sodium. A different element varies in its number of protons. That is the atomic number, and it is what defines elemental identity, so changing it makes a fundamentally different substance. Carbon with six protons and nitrogen with seven are not variations of one thing; they are different elements. The short version is neutrons for isotopes, electrons for ions, and protons for different elements, and only the last one changes what the thing actually is."],

["tutor","Functional groups by their properties","Sort the functional groups into polar and ionic, and explain what each does.",
 "The polar functional groups are hydroxyl and carbonyl. Hydroxyl, -OH, creates polarity and forms hydrogen bonds, which increases solubility in water; it appears in alcohols and sugars. Carbonyl is a carbon double bonded to oxygen; positioned in the middle of a carbon chain it makes a ketone, and at the end of a chain it makes an aldehyde, and those two are structural isomers of each other. The ionic groups are carboxyl, amino and phosphate. Carboxyl, -COOH, is found in organic acids, donates hydrogen ions in solution and gains a negative charge, which lets it form ionic bonds. Amino, -NH2, makes organic bases, accepts hydrogen ions and gains a positive charge. Phosphate carries four oxygens and a negative charge, and it makes the head of a phospholipid polar as well as driving ATP energy transfer. Two others sit outside those groupings: sulfhydryl, -SH, forms covalent crosslinks in proteins and is slightly polar, and methyl, -CH3, is nonpolar and unreactive."]

/* ---------- the checker ---------- */
function normalizeAnswer(t){
  return " " + t.toLowerCase().replace(/[^a-z0-9\s+-]/g, " ").replace(/\s+/g, " ") + " ";
}
function checkWritten(text, keys){
  const norm = normalizeAnswer(text);
  const hit = [], miss = [];
  (keys || []).forEach(k => {
    const stem = k.length > 6 ? k.slice(0, k.length - 1) : k;
    if(norm.indexOf(" " + stem) !== -1) hit.push(k); else miss.push(k);
  });
  const traps = [];
  ANSWER_TRAPS.forEach(([re, note]) => { if(re.test(text)) traps.push(note); });
  const words = text.trim().split(/\s+/).filter(Boolean).length;
  return {hit, miss, traps, words};
}
function keysFor(q){
  const k = Object.keys(ANSWER_KEYS).find(x => q.q.indexOf(x) === 0);
  return k ? ANSWER_KEYS[k] : null;
}
function runCheck(){
  const ta = document.getElementById("sa");
  const q = quizList[quizIndex];
  if(!ta || !q) return;
  const text = ta.value.trim();
  const box = document.getElementById("checkOut");
  if(text.length < 12){
    box.innerHTML = `<div class="verdict no"><b>Nothing to check yet.</b>Write or Scribble at least a sentence, then tap Check again.</div>`;
    return;
  }
  const keys = keysFor(q);
  const r = checkWritten(text, keys);
  let html = "";
  if(r.traps.length){
    html += `<div class="verdict no"><b>Watch these ${r.traps.length === 1 ? "phrase" : "phrases"}</b>` +
      r.traps.map(t => `<div style="margin-top:6px">${t}</div>`).join("") + `</div>`;
  }
  if(keys){
    const pct = Math.round(r.hit.length / keys.length * 100);
    html += `<div class="verdict ${pct >= 60 ? "ok" : "no"}">
      <b>${pct >= 80 ? "That covers it 🍓" : pct >= 60 ? "Most of it is there" : "Some pieces are missing"}</b>
      You used ${r.hit.length} of ${keys.length} key ideas in ${r.words} words.</div>`;
    if(r.hit.length){
      html += `<div class="chips"><span class="ct">YOU INCLUDED</span>` +
        r.hit.map(k => `<span class="chip-hit">${k}</span>`).join("") + `</div>`;
    }
    if(r.miss.length){
      html += `<div class="chips"><span class="ct">NOT MENTIONED &mdash; CHECK WHETHER THESE BELONG</span>` +
        r.miss.map(k => `<span class="chip-miss">${k}</span>`).join("") + `</div>`;
    }
    html += `<p class="checknote">This checks for key terms and common wrong phrases. It cannot judge whether your reasoning is right, so read the full-credit answer below and compare.</p>`;
  } else {
    html += `<div class="verdict ${r.traps.length ? "no" : "ok"}"><b>${r.words} words written.</b>No common wrong phrases found. Compare against the full-credit answer below.</div>`;
  }
  box.innerHTML = html;
  if(!quizAnswered) revealSA();
}

/* ---------- the drawing canvas ---------- */
let padCtx = null, padDrawing = false, padHistory = [];
function initPad(id){
  const c = document.getElementById(id);
  if(!c) return;
  const rect = c.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  c.width = rect.width * dpr;
  c.height = rect.height * dpr;
  const ctx = c.getContext && c.getContext("2d");
  if(!ctx) return;              /* no canvas support, leave the page working */
  ctx.scale(dpr, dpr);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue("--text-dark").trim() || "#3D2030";
  padCtx = ctx; padHistory = [];
  let last = null;

  const pos = e => {
    const r = c.getBoundingClientRect();
    return {x: e.clientX - r.left, y: e.clientY - r.top,
            p: (e.pointerType === "pen" && e.pressure) ? e.pressure : 0.5};
  };
  c.onpointerdown = e => {
    /* ignore the palm: if a pen is in use, fingers are ignored */
    if(padHistory.penUsed && e.pointerType === "touch") return;
    if(e.pointerType === "pen") padHistory.penUsed = true;
    c.setPointerCapture(e.pointerId);
    padDrawing = true; last = pos(e);
    padHistory.push(ctx.getImageData(0, 0, c.width, c.height));
    if(padHistory.length > 12) padHistory.shift();
  };
  c.onpointermove = e => {
    if(!padDrawing) return;
    e.preventDefault();
    const n = pos(e);
    ctx.lineWidth = 1 + n.p * 3.2;
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(n.x, n.y); ctx.stroke();
    last = n;
  };
  c.onpointerup = c.onpointercancel = () => { padDrawing = false; };
  c.style.touchAction = "none";
}
function padUndo(id){
  const c = document.getElementById(id);
  if(!c || !padHistory.length || !c.getContext) return;
  c.getContext("2d").putImageData(padHistory.pop(), 0, 0);
}
function padClear(id){
  const c = document.getElementById(id);
  if(!c || !c.getContext) return;
  c.getContext("2d").clearRect(0, 0, c.width, c.height);
  padHistory = [];
}
function toggleReveal(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.toggle("shown");
}

  document.querySelectorAll(".pom-row button[data-f]").forEach(b => {
    b.classList.toggle("on", +b.dataset.f === pomFocus && +b.dataset.b === pomBreak);
  });
  const f = document.getElementById("pomFocusN"), b = document.getElementById("pomBreakN");
  if(f) f.textContent = pomFocus;
  if(b) b.textContent = pomBreak;
}
function pomPreset(f, b){
  pomFocus = f; pomBreak = b; pomOnBreak = false;
  pomStop(); pomTotal = f*60; pomLeft = pomTotal;
  store.set("pom", [f,b]);
  paintPresets();
  document.getElementById("pomMsg").textContent = "";
  document.getElementById("pomPanel").classList.remove("done");
  pomPaint();
}
function pomNudge(which, delta){
  if(which === "f") pomFocus = Math.min(120, Math.max(1, pomFocus + delta));
  else pomBreak = Math.min(60, Math.max(1, pomBreak + delta));
  pomPreset(pomFocus, pomBreak);
}
function buildPresets(){
  const cell = ([f,b]) => `<button data-f="${f}" data-b="${b}" onclick="pomPreset(${f},${b})">${f}/${b}</button>`;
  document.getElementById("pomPresets").innerHTML =
    `<div class="pom-row">${POM_PRESETS.slice(0,4).map(cell).join("")}</div>
     <div class="pom-row">${POM_PRESETS.slice(4).map(cell).join("")}</div>
     <div class="pom-row custom">
       <button onclick="pomNudge('f',-5)">&#8722;</button>
       <span>focus <b id="pomFocusN">25</b>m</span>
       <button onclick="pomNudge('f',5)">+</button>
       <button onclick="pomNudge('b',-1)">&#8722;</button>
       <span>break <b id="pomBreakN">5</b>m</span>
       <button onclick="pomNudge('b',1)">+</button>
     </div>`;
  const saved = store.get("pom", null);
  if(saved){ pomFocus = saved[0]; pomBreak = saved[1]; pomTotal = pomFocus*60; pomLeft = pomTotal; }
  paintPresets();
}
function pomStop(){ pomRunning = false; if(pomTick){ clearInterval(pomTick); pomTick = null; } }
function pomStart(){
  if(pomRunning){ pomStop(); pomPaint(); return; }
  primeChime();
  document.getElementById("pomPanel").classList.remove("done");
  document.getElementById("pomMsg").textContent = "";
  pomRunning = true;
  pomTick = setInterval(() => {
    pomLeft--;
    if(pomLeft <= 0){ pomStop(); pomFinish(); }
    pomPaint();
  }, 1000);
  pomPaint();
}
function pomSkip(){ pomStop(); pomFinish(); }
function pomReset(){
  pomStop(); pomOnBreak = false; pomTotal = pomFocus*60; pomLeft = pomTotal;
  document.getElementById("pomMsg").textContent = "";
  document.getElementById("pomPanel").classList.remove("done"); pomPaint();
}
function pomFinish(){
  chime();
  const panel = document.getElementById("pomPanel");
  panel.classList.add("open","done");
  if(!pomOnBreak){
    pomOnBreak = true; pomTotal = pomBreak*60; pomLeft = pomTotal;
    document.getElementById("pomMsg").textContent = "Nice work. Stretch, drink water 🍓";
  } else {
    pomOnBreak = false; pomTotal = pomFocus*60; pomLeft = pomTotal;
    document.getElementById("pomMsg").textContent = "Break is over whenever you are ready";
  }
  pomPaint();
}
/* a soft three-note chime, slow swell and long fade, nothing that jolts you */
let audioCtx = null;
function primeChime(){
  try{ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
       if(audioCtx.state === "suspended") audioCtx.resume(); }catch(e){}
}
function chime(){
  try{
    primeChime(); if(!audioCtx) return;
    const now = audioCtx.currentTime;
    [587.33, 783.99, 1046.50].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      const t = now + i * 0.42;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.10, t + 0.30);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 2.0);
    });
  }catch(e){}
}
buildPresets();
pomPaint();

function shuffleOptions(q){
  if(q.type !== "mc" || !q.opts) return q;

  return Object.assign({}, q, {opts, a: opts.indexOf(correct)});
}

/* ---------- adaptive quiz: pull questions attached to shaky cards ---------- */
function shakyCards(){
  const m = getMarks();
  return Object.keys(m).filter(k => m[k]==="shaky").map(k => {
    const [dId,i] = k.split(":");
    const d = DECKS.find(x=>x.id===dId); if(!d) return null;
    const c = d.cards[+i]; if(!c) return null;
    return {dId, i:+i, c, deckName:d.name};
  }).filter(Boolean);
}
function adaptivePool(){
  const shaky = shakyCards();
  const missed = getMissed();
  const pool = QUIZ.filter(q => {
    const onShaky = q.cardSub && shaky.some(s => s.dId === q.cardDeck && s.c.q.indexOf(q.cardSub) !== -1);
    const wasMissed = missed.some(m => m.q === q.q);
    return onShaky || wasMissed;
  });
  return pool;
}
function startAdaptive(){
  const pool = adaptivePool();
  if(!pool.length) return;
  mode = "quiz";
  ["read","flip","quiz","weak","plan"].forEach(x => document.getElementById("m-"+x).setAttribute("aria-selected", String(x==="quiz")));
  startQuiz(shuffle(pool));
  scrollToContent();
}

      <button class="btn" style="width:100%" onclick="startAdaptive()">Quiz me on my weak spots</button>
    </div>`;
  }
  if(shaky.length){
    html += `<p class="weak-h">Cards you marked shaky (${shaky.length})</p>`;

    html += missed.map(m => {
      const d = DECKS.find(x=>x.id===m.deck);
      return `<div class="weak-item" style="cursor:default">${m.q}<small>${d?d.name:""}</small></div>`;
    }).join("");
    html += `<button class="btn ghost" style="width:100%;margin-bottom:8px" onclick="quizMissedSaved()">Redo only the missed questions</button>`;
    html += `<button class="btn ghost" style="width:100%" onclick="clearMissed()">Clear the missed list</button>`;
  }
  return html;
}
function quizMissedSaved(){
  const missed = getMissed();
  const list = QUIZ.filter(q => missed.some(m => m.q === q.q));
  if(!list.length) return;
  mode = "quiz";
  ["read","flip","quiz","weak","plan"].forEach(x => document.getElementById("m-"+x).setAttribute("aria-selected", String(x==="quiz")));
  startQuiz(shuffle(list));
  scrollToContent();
}


/* ---------- swipe between cards ---------- */
let touchX = 0, touchY = 0;
function attachSwipe(){
  const v = document.getElementById("view");
  v.ontouchstart = e => { touchX = e.changedTouches[0].clientX; touchY = e.changedTouches[0].clientY; };
  v.ontouchend = e => {
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    if(Math.abs(dx) < 55 || Math.abs(dy) > 45) return;
    if(mode === "read" && cardIndex >= 0){
      if(dx < 0) goCard(cardIndex + 1);
      else if(cardIndex > 0) goCard(cardIndex - 1);
    } else if(mode === "flip"){
      stepFlip(dx < 0 ? 1 : -1);
    }
  };
}


/* ---------- picture sheet: every diagram in a section, no words ---------- */
let sheetDeck = null;
function openSheet(dId){
  sheetDeck = dId; mode = "sheet";
  ["read","flip","quiz","weak","plan"].forEach(x => document.getElementById("m-"+x).setAttribute("aria-selected","false"));
  render(); scrollToContent();
}
function renderSheet(){
  const d = DECKS.find(x => x.id === sheetDeck);
  if(!d) return "";
  const keys = [];
  d.cards.forEach(c => { [c.fig, c.fig2].forEach(k => { if(k && FIG[k] && keys.indexOf(k) === -1) keys.push(k); }); });
  return `<div class="cover" style="margin-bottom:14px">
      <span class="em">${COVERS[d.id].em}</span>
      <h2>${d.name}</h2>
      <p class="meta">${keys.length} diagrams, no text. Scroll through and name each part as it goes by.</p>
      <button class="btn ghost" onclick="setMode('plan')">Back to the plan</button>
    </div>` +
    keys.map(k => `<div class="sheetfig">${FIG[k]}</div>`).join("");
}

/* ---------- the last hour plan ---------- */
const LIKELY_SA = [
  "Write the null and alternate hypothesis",
  "state a scientific law and then a scientific theory",
  "A Mars rover returns objects that look like microbes",
  "Given CO2 + H2O in equilibrium",
  "Trace a newly synthesized protein from synthesis to secretion",
  "A volume of water has a pH of 3",
  "Explain how a single amino acid change causes sickle cell anemia"
];
function likelyList(){
  return LIKELY_SA.map(sub => QUIZ.find(q => q.q.indexOf(sub.slice(0,42)) !== -1)).filter(Boolean);
}
function quizLikely(){
  const list = likelyList();
  if(!list.length) return;
  mode = "quiz";
  ["read","flip","quiz","weak","plan"].forEach(x => document.getElementById("m-"+x).setAttribute("aria-selected", String(x==="quiz")));
  startQuiz(list);
  scrollToContent();
}
function renderPlan(){
  const pool = adaptivePool();
  const likely = likelyList();
  return `<div class="cover" style="margin-bottom:16px">
      <span class="em">⏰</span>
      <h2>Before the exam</h2>
      <p style="color:var(--text-mid);margin-top:8px">Three things, in this order. Nothing new, no rereading the whole guide.</p>
    </div>

    <div class="plan-step">
      <span class="n">FIRST</span>
      <h4>Look at the pictures</h4>
      <p>Every diagram from a section, no words. Name the parts out loud as you scroll.</p>
      <button class="btn" onclick="openSheet('chem')">Chemistry &amp; water diagrams</button>
      <button class="btn" onclick="openSheet('macro')">Macromolecule diagrams</button>
      <button class="btn" onclick="openSheet('cells')">Cell diagrams</button>
      <button class="btn ghost" onclick="setDeck('tutor');setMode('quiz')">Or go straight to the practice exam</button>
    </div>

    <div class="plan-step">
      <span class="n">THEN</span>
      <h4>Quiz yourself</h4>
      <p>${pool.length
        ? "Just the " + pool.length + " question" + (pool.length===1?"":"s") + " tied to what you flagged and what you have missed."
        : "Pick a section and let the quiz find your gaps."}</p>
      ${pool.length
        ? `<button class="btn" onclick="startAdaptive()">Quiz my weak spots</button>`
        : `<button class="btn" onclick="setMode('quiz')">Start a quiz</button>`}
    </div>

    <div class="plan-step">
      <span class="n">LAST</span>
      <h4>Say these five out loud</h4>
      <p>The most likely short answer questions. Out loud, in full sentences, before you check.</p>
      ${likely.map(q => `<div class="plan-q">${q.q}</div>`).join("")}
      <button class="btn" onclick="quizLikely()">Practice these five</button>
      <button class="btn ghost" onclick="startWritten('all')">Or drill every written question</button>
    </div>

    <div class="cover" style="text-align:center">
      <span class="em">🍓</span>
      <p style="color:var(--text-mid)">Then stop. Eat something and go in.</p>
    </div>`;
}

/* ---------- render ---------- */
function render(){
  const _v = document.getElementById("view");
  _v.innerHTML =
    mode==="read" ? renderRead() : mode==="flip" ? renderFlip() : mode==="weak" ? renderWeak()
    : mode==="plan" ? renderPlan() : mode==="sheet" ? renderSheet() : renderQuiz();
  attachSwipe();
  if(document.getElementById("pad")) initPad("pad");
}
document.addEventListener("keydown", e => {
  if(mode==="flip"){ if(e.key==="ArrowRight") stepFlip(1); if(e.key==="ArrowLeft") stepFlip(-1); }
  else if(mode==="read" && cardIndex>=0){
    if(e.key==="ArrowRight") goCard(cardIndex+1);
    if(e.key==="ArrowLeft" && cardIndex>0) goCard(cardIndex-1);
  }
});
const savedDeck = store.get("deck", null);
if(savedDeck && DECKS.some(d=>d.id===savedDeck)) deckId = savedDeck;
renderDecks();
render();
</script>
</body>
