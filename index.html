<style>
/* ===== palette lifted from the roadmap app ===== */
:root{
  --rose:#D4728A; --rose-light:#F2B8C6; --rose-pale:#FAE8EE;
  --lavender:#C98DAA; --lavender-light:#E4C3D4; --lavender-pale:#F5E9F0;
  --mauve:#A86E8A; --cream:#FDF6F2; --cream-dark:#F5EBE4;
  --text-dark:#3D2030; --text-mid:#6B4558; --text-soft:#9B7589;
  --white:#FFFFFF;
  --shadow:0 4px 20px rgba(160,98,122,.12);
  --shadow-hover:0 8px 30px rgba(160,98,122,.22);
  --radius:18px; --radius-sm:10px;
  --body-bg:#FDF6F2;
  --header-grad:linear-gradient(135deg,#F7D9E3 0%,#FDF6F2 100%);
  --pill-active:linear-gradient(135deg,#D4728A,#A86E8A);
  --good:#5C8D89; --good-pale:#E4F0EE;
  --bad:#C0566B; --bad-pale:#FBE7EB;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --rose:#E38DA2; --rose-light:#6E3F52; --rose-pale:#3A2130;
    --lavender:#C98DAA; --lavender-light:#5C3A4C; --lavender-pale:#33202C;
    --mauve:#E0A8C2; --cream:#2A1723; --cream-dark:#3A2532;
    --text-dark:#F6E6EE; --text-mid:#D9AFC4; --text-soft:#A97E92;
    --white:#33202C;
    --shadow:0 4px 20px rgba(0,0,0,.42);
    --shadow-hover:0 8px 30px rgba(0,0,0,.55);
    --body-bg:#1E1019;
    --header-grad:linear-gradient(135deg,#4A2739 0%,#2A1723 100%);
    --pill-active:linear-gradient(135deg,#B85D7C,#6E2A46);
    --good:#8FC4BE; --good-pale:#22322F;
    --bad:#E38DA2; --bad-pale:#3A2130;
  }
}
:root[data-theme="dark"]{
  --rose:#E38DA2; --rose-light:#6E3F52; --rose-pale:#3A2130;
  --lavender:#C98DAA; --lavender-light:#5C3A4C; --lavender-pale:#33202C;
  --mauve:#E0A8C2; --cream:#2A1723; --cream-dark:#3A2532;
  --text-dark:#F6E6EE; --text-mid:#D9AFC4; --text-soft:#A97E92;
  --white:#33202C;
  --shadow:0 4px 20px rgba(0,0,0,.42);
  --shadow-hover:0 8px 30px rgba(0,0,0,.55);
  --body-bg:#1E1019;
  --header-grad:linear-gradient(135deg,#4A2739 0%,#2A1723 100%);
  --pill-active:linear-gradient(135deg,#B85D7C,#6E2A46);
  --good:#8FC4BE; --good-pale:#22322F;
  --bad:#E38DA2; --bad-pale:#3A2130;
}
:root[data-theme="light"]{
  --rose:#D4728A; --rose-light:#F2B8C6; --rose-pale:#FAE8EE;
  --lavender:#C98DAA; --lavender-light:#E4C3D4; --lavender-pale:#F5E9F0;
  --mauve:#A86E8A; --cream:#FDF6F2; --cream-dark:#F5EBE4;
  --text-dark:#3D2030; --text-mid:#6B4558; --text-soft:#9B7589;
  --white:#FFFFFF;
  --shadow:0 4px 20px rgba(160,98,122,.12);
  --shadow-hover:0 8px 30px rgba(160,98,122,.22);
  --body-bg:#FDF6F2;
  --header-grad:linear-gradient(135deg,#F7D9E3 0%,#FDF6F2 100%);
  --pill-active:linear-gradient(135deg,#D4728A,#A86E8A);
  --good:#5C8D89; --good-pale:#E4F0EE;
  --bad:#C0566B; --bad-pale:#FBE7EB;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--body-bg); color:var(--text-dark);
  font-family:'IBM Plex Sans',-apple-system,Helvetica,Arial,sans-serif;
  font-size:16.5px; line-height:1.6; -webkit-text-size-adjust:100%;
  padding-bottom:70px;
}
.wrap{max-width:700px;margin:0 auto;padding:0 16px 40px}
@media (min-width:760px){ .wrap{max-width:860px;padding:0 22px 60px} body{font-size:17.5px} }
@media (min-width:1040px){ .wrap{max-width:1000px} }

/* ===== header ===== */
.hero{
  background:var(--header-grad);
  padding:30px 16px 26px; text-align:center;
  border-radius:0 0 30px 30px; position:relative; overflow:hidden; margin-bottom:20px;
}
.star{position:absolute;color:var(--rose);font-size:12px;animation:twinkle 3.5s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.45;transform:scale(1.25)}}
@media (prefers-reduced-motion: reduce){.star{animation:none;opacity:.25}}
.hero h1{
  font-family:'Spectral',Georgia,serif; font-weight:600;
  font-size:clamp(26px,7vw,36px); line-height:1.12; letter-spacing:-.5px;
  margin:10px 0 6px; position:relative;
}
.hero p{color:var(--text-mid);font-size:14.5px;position:relative}
.chip{
  display:inline-block;margin-top:12px;background:var(--white);color:var(--rose);
  border-radius:999px;padding:6px 16px;font-size:13.5px;font-weight:700;
  box-shadow:var(--shadow);position:relative;
}

/* ===== controls ===== */
.modes{display:flex;background:var(--cream-dark);border-radius:999px;padding:4px;gap:4px;margin-bottom:14px}
.modes button{
  flex:1;border:0;background:transparent;color:var(--text-soft);
  font-family:inherit;font-size:12.5px;font-weight:700;padding:10px 1px;border-radius:999px;cursor:pointer;white-space:nowrap;
}
.modes button[aria-selected="true"]{background:var(--pill-active);color:#fff;box-shadow:var(--shadow)}
.decks{display:flex;gap:7px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:none;justify-content:flex-start}
@media (min-width:760px){ .decks{justify-content:center;flex-wrap:wrap;overflow:visible;row-gap:9px} }
.decks::-webkit-scrollbar{display:none}
.decks button{
  white-space:nowrap;border:1.5px solid var(--rose-light);background:var(--white);
  color:var(--text-mid);font-family:inherit;font-size:13.5px;font-weight:600;
  padding:8px 14px;border-radius:999px;cursor:pointer;
}
.decks button[aria-selected="true"]{background:var(--pill-active);border-color:transparent;color:#fff}
.theme-toggle{
  position:fixed;right:14px;bottom:14px;z-index:300;
  width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;
  background:var(--white);color:var(--text-dark);font-size:21px;line-height:1;
  box-shadow:0 6px 20px rgba(61,32,48,.28);transition:transform .2s ease;
}
.theme-toggle:active{transform:scale(.94)}

/* ===== section cover ===== */
.cover{
  background:var(--white);border-radius:var(--radius);padding:30px 22px;text-align:center;
  box-shadow:var(--shadow);
}
.cover .em{font-size:44px;display:block;margin-bottom:6px}
.cover h2{font-family:'Spectral',Georgia,serif;font-size:27px;font-weight:700;margin-bottom:4px}
.cover .meta{color:var(--text-soft);font-size:14px;margin-bottom:18px}
.cover ul{list-style:none;text-align:left;max-width:340px;margin:0 auto 22px}
.cover ul li{
  padding:9px 0 9px 26px;position:relative;color:var(--text-mid);font-size:15px;
  border-bottom:1px solid var(--cream-dark);
}
.cover ul li:last-child{border-bottom:0}
.cover ul li:before{content:"🍓";position:absolute;left:0;font-size:13px}

/* ===== one card at a time ===== */
.dots{display:flex;gap:5px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--cream-dark);display:block}
.dots i.on{background:var(--rose);transform:scale(1.3)}
.dots i.done{background:var(--rose-light)}
.card{
  background:var(--white);border-radius:var(--radius);padding:20px 18px 18px;
  box-shadow:var(--shadow);margin-bottom:14px;
}
.card .em{font-size:26px;display:block;margin-bottom:4px}
.card h3{
  font-family:'Spectral',Georgia,serif;font-size:21px;font-weight:700;
  line-height:1.28;margin-bottom:14px;letter-spacing:-.2px;
}
.fig{background:var(--cream);border-radius:14px;padding:12px;margin-bottom:16px}
.fig svg{display:block;width:100%;height:auto}
.answer{
  background:var(--rose-pale);border-radius:14px;padding:14px 16px;margin-bottom:14px;
}
.answer .t{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;color:var(--rose);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:5px}
.answer p{font-size:16.5px;line-height:1.55}
.more{margin-bottom:6px}
.more>button{
  width:100%;text-align:left;border:1.5px solid var(--cream-dark);background:var(--white);
  color:var(--text-mid);font-family:inherit;font-size:14.5px;font-weight:600;
  padding:12px 14px;border-radius:12px;cursor:pointer;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.more>button .plus{color:var(--rose);font-size:18px;font-weight:700;line-height:1}
.more .panel{
  display:none;padding:2px 14px 14px;font-size:15.5px;color:var(--text-mid);line-height:1.55;
  margin:-6px 0 8px;
}
.more.open .panel{display:block}
.more.open>button{border-color:var(--rose-light);background:var(--cream)}
.panel.trick{background:var(--lavender-pale);border-radius:12px;padding:12px 14px;color:var(--text-dark)}
.aloud{
  border:1.5px dashed var(--rose-light);border-radius:14px;padding:13px 15px;
  font-size:15px;color:var(--text-mid);margin-top:6px;
}
.aloud b{font-family:'IBM Plex Mono',monospace;color:var(--rose);display:block;font-size:10.5px;letter-spacing:1px;margin-bottom:4px}

/* ===== nav ===== */
.nav{display:flex;gap:9px;align-items:center;margin-top:4px}
.nav button{
  flex:1;border:1.5px solid var(--rose-light);background:var(--white);color:var(--text-dark);
  font-family:inherit;font-weight:700;font-size:15px;padding:13px;border-radius:14px;cursor:pointer;
}
.nav button.primary{background:var(--pill-active);border-color:transparent;color:#fff}
.nav button:disabled{opacity:.4}
.nav .count{flex:0 0 auto;color:var(--text-soft);font-size:13.5px;font-weight:700;min-width:56px;text-align:center}

/* ===== flashcards ===== */
.flipwrap{perspective:1400px;margin-bottom:14px}
.flip{position:relative;width:100%;min-height:340px;cursor:pointer;transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.3,.8,.4,1)}
@media (prefers-reduced-motion: reduce){.flip{transition:none}}
.flip.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--white);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);overflow:auto}
.face.back{transform:rotateY(180deg)}
.front-q{font-family:'Spectral',Georgia,serif;font-size:23px;font-weight:700;line-height:1.3;
  display:flex;min-height:100%;align-items:center;justify-content:center;text-align:center}
.hint{font-size:13.5px;color:var(--text-soft);text-align:center;margin-bottom:12px}
.mini{font-size:15px;color:var(--text-mid);margin-bottom:12px}
.mini b{font-family:'IBM Plex Mono',monospace;display:block;font-size:10px;letter-spacing:1px;color:var(--rose);margin-bottom:4px}

/* ===== quiz ===== */
.q-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-soft);margin-bottom:9px;font-weight:500;letter-spacing:.4px}
.q-text{font-family:'Spectral',Georgia,serif;font-size:20px;font-weight:700;line-height:1.35;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:9px}
.opts button{
  text-align:left;border:1.5px solid var(--cream-dark);background:var(--cream);color:var(--text-dark);
  font-family:inherit;font-size:15.5px;padding:13px 15px;border-radius:13px;cursor:pointer;line-height:1.4;
}
.opts button.right{background:var(--good-pale);border-color:var(--good)}
.opts button.wrong{background:var(--bad-pale);border-color:var(--bad)}
textarea{
  width:100%;min-height:110px;background:var(--cream);color:var(--text-dark);
  border:1.5px solid var(--cream-dark);border-radius:13px;padding:13px;font-family:inherit;font-size:16px;resize:vertical;
}
textarea:focus{outline:none;border-color:var(--rose)}
.verdict{margin-top:14px;padding:13px 15px;border-radius:13px;font-size:15.5px;line-height:1.5}
.verdict.ok{background:var(--good-pale);border:1.5px solid var(--good)}
.verdict.no{background:var(--bad-pale);border:1.5px solid var(--bad)}
.verdict b{display:block;margin-bottom:4px}
.model{margin-top:14px;padding:14px;border-radius:13px;background:var(--lavender-pale);font-size:15.5px;line-height:1.5}
.model b{font-family:'IBM Plex Mono',monospace;display:block;margin-bottom:6px;font-size:10px;color:var(--mauve);letter-spacing:1px}
.selfmark{display:flex;gap:9px;margin-top:12px}
.selfmark button{flex:1;border:1.5px solid var(--rose-light);background:var(--white);color:var(--text-dark);
  font-family:inherit;font-weight:700;padding:11px;border-radius:13px;cursor:pointer;font-size:14.5px}
.score{background:var(--white);border-radius:var(--radius);padding:26px 20px;text-align:center;box-shadow:var(--shadow)}
.score .big{font-family:'Spectral',Georgia,serif;font-size:54px;font-weight:700;line-height:1;margin:6px 0;color:var(--rose)}
.score p{color:var(--text-mid);margin-bottom:16px}
.missed{text-align:left;margin-top:16px;list-style:none}
.missed li{margin-bottom:8px;font-size:15px;color:var(--text-mid);padding-left:22px;position:relative}
.missed li:before{content:"•";position:absolute;left:6px;color:var(--rose)}
.btn{
  border:none;background:var(--pill-active);color:#fff;font-family:inherit;font-weight:700;
  font-size:15.5px;padding:13px 20px;border-radius:14px;cursor:pointer;
}
.btn.ghost{background:var(--white);color:var(--text-dark);border:1.5px solid var(--rose-light)}
.prog{height:6px;background:var(--cream-dark);border-radius:999px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--pill-active);width:0;transition:width .3s}
:focus-visible{outline:2.5px solid var(--rose);outline-offset:2px}


/* ===== self-marking ===== */
.mark{display:flex;gap:9px;margin-top:12px}
.mark button{
  flex:1;border:1.5px solid var(--rose-light);background:var(--white);color:var(--text-mid);
  font-family:inherit;font-weight:700;font-size:14px;padding:11px 6px;border-radius:13px;cursor:pointer;
}
.mark button.sel-got{background:var(--good-pale);border-color:var(--good);color:var(--text-dark)}
.mark button.sel-shaky{background:var(--rose-pale);border-color:var(--rose);color:var(--text-dark)}
.dots i.shaky{background:var(--rose);box-shadow:0 0 0 2px var(--rose-pale)}
.dots i.got{background:var(--good)}
/* ===== source badge ===== */
.cardtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.cardtop .em{margin-bottom:0}
.src{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.8px;
  text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap;
}
.src.lec{background:var(--rose-pale);color:var(--rose)}
.src.guide{background:var(--cream-dark);color:var(--text-soft)}
/* ===== pomodoro ===== */
.pom-btn{
  position:fixed;left:14px;bottom:14px;z-index:300;height:50px;min-width:50px;padding:0 15px;
  border-radius:25px;border:none;cursor:pointer;background:var(--white);color:var(--text-dark);
  font-family:inherit;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(61,32,48,.28);
  display:flex;align-items:center;gap:7px;
}
.pom-btn .berry{font-size:19px;line-height:1}
.pom-panel{
  position:fixed;left:14px;bottom:74px;z-index:301;width:276px;
  background:var(--white);border-radius:22px;padding:18px;box-shadow:0 12px 40px rgba(61,32,48,.32);
  display:none;text-align:center;
}
.pom-panel.open{display:block}
.pom-panel h5{font-family:'Spectral',Georgia,serif;font-size:17px;font-weight:700;margin-bottom:2px}
.pom-panel .state{font-size:12.5px;color:var(--text-soft);margin-bottom:10px}
.pom-ring{position:relative;width:132px;height:132px;margin:0 auto 12px}
.pom-ring svg{transform:rotate(-90deg);display:block}
.pom-ring .berry-big{
  position:absolute;top:0;left:0;right:0;bottom:22px;display:flex;align-items:center;justify-content:center;
  font-size:34px;transition:transform .3s;
}
.pom-ring .time{
  position:absolute;left:0;right:0;bottom:14px;font-size:19px;font-weight:600;font-family:'IBM Plex Mono',monospace;
  font-variant-numeric:tabular-nums;color:var(--text-dark);
}
.pom-panel.done .berry-big{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
@media (prefers-reduced-motion: reduce){.pom-panel.done .berry-big{animation:none}}
.pom-row{display:flex;gap:7px;margin-bottom:8px}
.pom-row button{
  flex:1;border:1.5px solid var(--rose-light);background:var(--white);color:var(--text-mid);
  font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 2px;border-radius:11px;cursor:pointer;
}
.pom-row.custom{align-items:center;gap:5px;margin-top:2px}
.pom-row.custom span{font-size:12px;color:var(--text-soft);white-space:nowrap;flex:0 0 auto}
.pom-row.custom span b{color:var(--text-dark);font-size:13px}
.pom-row.custom button{flex:0 0 26px;padding:5px 0;font-size:14px;border-radius:8px}
.pom-panel{width:276px}
.pom-sub{margin:0}
.pom-row button.on{background:var(--pill-active);border-color:transparent;color:#fff}
.pom-go{width:100%;border:none;background:var(--pill-active);color:#fff;font-family:inherit;

.pom-msg{font-size:13.5px;color:var(--rose);font-weight:700;margin-bottom:8px;min-height:18px}
/* ===== wide screen card layout ===== */
@media (min-width:900px){
  .card{padding:26px 28px 24px}

  .cardgrid.solo{max-width:780px;margin:0 auto}

  .card h3{font-size:24px}
  .cover{padding:38px 34px}
  .cover ul{max-width:420px}
  .face{padding:28px}
  .flip{min-height:400px}
  .sheetfig{padding:20px}
  .plan-step{padding:22px 26px}
  .plan-step .btn,.plan-step .btn.ghost{width:auto;min-width:240px;margin-right:8px}
}
@media (min-width:900px) and (max-width:1039px){
  .cardgrid.has-fig{grid-template-columns:1fr 1fr}
}
/* ===== last hour plan ===== */
.plan-step{
  background:var(--white);border-radius:var(--radius);padding:18px;margin-bottom:13px;box-shadow:var(--shadow);
  border-left:5px solid var(--rose);
}
.plan-step .n{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:1.4px;color:var(--rose);display:block;margin-bottom:6px}
.plan-step h4{font-family:'Spectral',Georgia,serif;font-size:19px;font-weight:700;margin-bottom:6px}
.plan-step p{color:var(--text-mid);font-size:15px;margin-bottom:12px}
.plan-step .btn,.plan-step .btn.ghost{width:100%;margin-bottom:8px}
.plan-q{font-size:14.5px;color:var(--text-mid);padding:8px 0 8px 20px;position:relative;border-bottom:1px solid var(--cream-dark)}
.plan-q:before{content:"🍓";position:absolute;left:0;font-size:11px}
.plan-q:last-of-type{border-bottom:0;margin-bottom:10px}
/* ===== picture sheet ===== */
.sheetfig{background:var(--white);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.sheetfig svg{display:block;width:100%;height:auto}
/* ===== quiz picker ===== */
.pick{
  display:block;width:100%;text-align:left;border:1.5px solid var(--rose-light);
  background:var(--white);color:var(--text-dark);font-family:inherit;

}
.pick b{font-size:16.5px;display:block;margin-bottom:3px}
.pick small{display:block;color:var(--text-soft);font-size:13.5px;line-height:1.4}

.deepbox>button{border-color:var(--lavender-light);background:var(--lavender-pale);color:var(--mauve)}
.deepbox.open>button{background:var(--lavender-pale);border-color:var(--lavender)}
.panel.deep{background:var(--lavender-pale);border-radius:12px;padding:14px 15px;color:var(--text-dark)}
.panel.deep .dt{font-family:'IBM Plex Mono',monospace;display:block;font-size:10px;font-weight:600;letter-spacing:1px;color:var(--mauve);margin:13px 0 5px}
.panel.deep .dt:first-child{margin-top:0}
.panel.deep p{margin:0;font-size:15.5px;line-height:1.55}
/* ===== cross links ===== */
.links{margin-top:12px;padding-top:12px;border-top:1px solid var(--cream-dark)}
.links .t{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--text-soft);letter-spacing:1px;display:block;margin-bottom:8px}
.links button{
  display:block;width:100%;text-align:left;border:1.5px solid var(--lavender-light);
  background:var(--lavender-pale);color:var(--text-dark);font-family:inherit;font-size:14px;
  padding:10px 13px;border-radius:12px;cursor:pointer;margin-bottom:7px;line-height:1.4;
}
.links button b{color:var(--mauve)}
/* ===== weak spots ===== */
.weak-h{font-family:'Spectral',Georgia,serif;font-size:20px;font-weight:700;margin:18px 0 10px}
.weak-item{
  display:block;width:100%;text-align:left;background:var(--white);border:1.5px solid var(--rose-light);
  border-radius:13px;padding:12px 14px;margin-bottom:9px;font-family:inherit;font-size:15px;
  color:var(--text-dark);cursor:pointer;line-height:1.4;
}
.weak-item small{display:block;color:var(--text-soft);font-size:12.5px;margin-top:3px}
.empty{background:var(--white);border-radius:var(--radius);padding:30px 20px;text-align:center;box-shadow:var(--shadow)}
.empty span{font-size:38px;display:block;margin-bottom:8px}
.empty p{color:var(--text-mid)}

/* svg hooks */
svg .s-line{stroke:var(--text-dark)}

svg .s-alt{stroke:var(--mauve)}

svg .f-acc{fill:var(--rose)}
svg .f-alt{fill:var(--mauve)}
svg .f-surf{fill:var(--white)}
svg .f-pale{fill:var(--rose-pale)}
svg .f-none{fill:none}
</style>

FIG.bonds = `<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ionic, covalent and hydrogen bonds compared">

<text x="350" y="180" class="f-sm" text-anchor="middle" font-size="12">Unequal share = polar</text>
<text x="350" y="200" class="f-sm" text-anchor="middle" font-size="12">Strongest of the three</text>

FIG.water = `<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Water polarity and hydrogen bonding">
<text x="350" y="18" class="f-txt" text-anchor="middle" font-size="14" font-weight="700">Why water is weird (and why you are alive because of it)</text>
<g transform="translate(20,30)">
<circle cx="100" cy="70" r="34" class="f-surf s-line" stroke-width="1.8"/><text x="100" y="76" class="f-txt" text-anchor="middle" font-size="16" font-weight="700">O</text>
<circle cx="48" cy="122" r="21" class="f-surf s-line" stroke-width="1.8"/><text x="48" y="127" class="f-txt" text-anchor="middle" font-size="13" font-weight="700">H</text>
<circle cx="152" cy="122" r="21" class="f-surf s-line" stroke-width="1.8"/><text x="152" y="127" class="f-txt" text-anchor="middle" font-size="13" font-weight="700">H</text>
<line x1="76" y1="94" x2="63" y2="107" class="s-line" stroke-width="2.2"/><line x1="124" y1="94" x2="137" y2="107" class="s-line" stroke-width="2.2"/>
<text x="100" y="30" class="f-acc f-txt" text-anchor="middle" font-size="13" font-weight="700">&#948;&#8722; partial negative</text>
<text x="20" y="160" class="f-acc f-txt" font-size="13" font-weight="700">&#948;+</text><text x="170" y="160" class="f-acc f-txt" font-size="13" font-weight="700">&#948;+</text>
<text x="100" y="182" class="f-sm" text-anchor="middle">Oxygen hogs the shared electrons</text>
<text x="100" y="198" class="f-sm" text-anchor="middle">(higher electronegativity) &#8594; polar</text>
</g>
<line x1="250" y1="36" x2="250" y2="228" class="s-dim" stroke-width="1.2"/>
<g class="f-txt" font-size="13">
<text x="272" y="56" font-weight="700">1. Cohesion &amp; adhesion</text><text x="272" y="73" class="f-sm">water sticks to water, and to other stuff &#8594; water climbs a tree trunk</text>
<text x="272" y="100" font-weight="700">2. High heat capacity</text><text x="272" y="117" class="f-sm">takes a lot of heat to warm up &#8594; your body temp stays steady</text>
<text x="272" y="144" font-weight="700">3. High heat of vaporization</text><text x="272" y="161" class="f-sm">escaping steam carries heat off &#8594; sweating cools you down</text>
<text x="272" y="188" font-weight="700">4. Universal solvent</text><text x="272" y="205" class="f-sm">dissolves anything polar or charged &#8594; blood, cytoplasm, ocean</text>
</g>
<text x="272" y="232" class="f-sm">All four come from ONE thing: hydrogen bonds between polar water molecules.</text>
</svg>`;

 icon:"🧲",
 fig:null,
 plain:"When a hydrogen is attached to an oxygen or nitrogen, it becomes slightly positive and gets attracted to a slightly negative atom nearby. One of these is easy to break. But your body has trillions of them, and together they hold water, DNA, and proteins in shape.",
 sci:"A hydrogen bond is a weak electrostatic attraction between a hydrogen atom covalently bonded to a highly electronegative atom (O, N, or F) and another electronegative atom bearing a partial negative charge. Individual hydrogen bonds are roughly 1/20 the strength of a covalent bond, but their collective effect is substantial. They produce the emergent properties of water, hold the DNA double helix together (A-T with 2, G-C with 3), and stabilize protein secondary structure.",
 trick:"Hydrogen bonds are velcro. One hook is nothing. Ten thousand hooks hold your jacket shut. And their weakness is the point: DNA has to be able to unzip.",
 aloud:"Explain why it would actually be bad if hydrogen bonds were strong."},

{q:"Why is water polar, and what does that cause?",
 icon:"💧",
 fig:"water",
 plain:"Oxygen pulls the shared electrons harder than hydrogen does, so the oxygen side of a water molecule is slightly negative and the hydrogen side is slightly positive. Opposite ends attract each other, so water molecules cling together.",
 sci:"Water's bent molecular geometry combined with oxygen's high electronegativity produces an asymmetric charge distribution: partial negative at oxygen, partial positive at each hydrogen. This permanent dipole allows each water molecule to form up to four hydrogen bonds with neighbors, and this hydrogen bonding network is the single cause of all of water's emergent properties.",
 trick:"Water is a tiny magnet with a Mickey Mouse shape. If the molecule were straight instead of bent, the charges would cancel and water would be boring.",
 aloud:"Trace it: electronegativity, then partial charges, then hydrogen bonds, then ONE specific property. That chain is the answer to most water questions."},

{q:"The four emergent properties of water, each with a biological example.",
 icon:"🌊",
 fig:"water",
 plain:"1. It sticks to itself and to other things, so water climbs up trees. 2. It takes a lot of heat to warm up, so your body temperature stays steady. 3. It takes a lot of heat to evaporate, so sweating cools you off. 4. It dissolves anything with a charge, so it can carry nutrients through blood.",
 sci:"Cohesion (water to water) and adhesion (water to other surfaces) produce surface tension and capillary action, which drive transpirational water transport in xylem. High specific heat capacity means water absorbs substantial heat with minimal temperature change, buffering organismal and global temperature. High heat of vaporization means evaporation removes large amounts of heat, enabling evaporative cooling through perspiration. Polarity makes water a solvent for polar and ionic solutes, forming hydration shells, which is why cytoplasm, blood plasma, and interstitial fluid are aqueous.",
 trick:"CHHS, say it as 'see H-H-S': Cohesion/adhesion, High heat capacity, High heat of vaporization, Solvent. Every one of them traces back to hydrogen bonding.",
 aloud:"For each property, name the biological consequence. Property alone gets partial credit; property plus consequence gets full credit."},

{q:"Hydrophilic vs hydrophobic, and why water is called the universal solvent.",
 icon:"🫧",
 fig:"solvent",
 plain:"Hydrophilic means water-loving: anything polar or charged mixes with water. Hydrophobic means water-fearing: anything nonpolar, like oil, refuses to mix and clumps together instead.",
 sci:"Hydrophilic substances are polar or ionic and form favorable interactions with water, becoming solvated by hydration shells. Hydrophobic substances are nonpolar and cannot form hydrogen bonds with water, so they aggregate to minimize contact with it. Water is described as a universal solvent because it dissolves a wider range of polar and ionic substances than any other liquid, not because it dissolves literally everything. The hydrophobic effect drives membrane formation and protein folding.",
 trick:"Philic = friendly. Phobic = phobia, afraid. And remember: LIKE DISSOLVES LIKE. Polar dissolves polar, nonpolar dissolves nonpolar.",
 aloud:"Explain why oil and water separate. The real answer is about what water does, not what oil does."},

{q:"Acids, bases, and the pH scale.",
 icon:"🍋",
 fig:"ph",
 plain:"An acid dumps extra H+ into a solution. A base soaks H+ up, or adds OH-. pH measures how much H+ is floating around: low pH means lots of H+ and acidic, high pH means little H+ and basic, 7 is neutral.",
 sci:"An acid is a proton donor, increasing hydrogen ion concentration. A base is a proton acceptor, decreasing hydrogen ion concentration or increasing hydroxide ion concentration. pH is the negative base-10 logarithm of hydrogen ion concentration, so each unit represents a tenfold change. At pH 7, hydrogen and hydroxide concentrations are equal. Human blood is maintained near 7.4.",
 trick:"Acid Adds H+. Base Bags H+. And the scale is backwards on purpose: MORE H+ means LOWER number, because of the negative in the log.",
 aloud:"How many times more acidic is pH 3 than pH 6? Say the reasoning, not just the number."},

{q:"What is a buffer, and why is it crucial?",
 icon:"🧽",
 fig:null,
 plain:"A buffer is a chemical sponge for acidity. When acid shows up it absorbs H+, and when things get too basic it releases H+, so the pH barely moves.",
 sci:"A buffer is a system, typically a weak acid and its conjugate base, that resists changes in pH by accepting or donating hydrogen ions. The bicarbonate buffer system (carbonic acid and bicarbonate) maintains blood pH within roughly 7.35 to 7.45. Deviation outside this narrow range denatures enzymes and is rapidly fatal, which is why buffering is non-optional for life.",
 trick:"A buffer is a shock absorber for pH. Enzymes are the reason it matters: wrong pH, wrong protein shape, no reaction, dead.",
 aloud:"Connect two chapters out loud: what does a pH change physically DO to a protein? That link between chapters is exactly the kind of depth question that earns full credit."},

{q:"Why is carbon the backbone of life?",
 icon:"💎",
 fig:"carbonBonds",
 plain:"Carbon has four open bonding spots, so it can link to four different things at once, including other carbons. That lets it build chains, branches, and rings of basically unlimited complexity. No other common element is that versatile.",
 sci:"Carbon has four valence electrons and forms four stable covalent bonds. It bonds readily with itself (catenation) to form chains, branched structures, and rings, and it bonds with hydrogen, oxygen, nitrogen, phosphorus, and sulfur. This tetravalence combined with moderate bond strength generates the structural diversity required for biological macromolecules.",
 trick:"Carbon is LEGO. Four connection points means you can build anything. Silicon has four too, but its bonds are clumsier and it cannot make the same variety.",
 aloud:"Explain why four bonds specifically creates diversity. Two would give you a chain, three gives flat shapes, four gives 3D branching."},

{q:"What are hydrocarbons, and why do they store energy well?",
 icon:"🔋",
 fig:"hydrocarbon",
 plain:"Molecules made of only carbon and hydrogen. Their C-H bonds hold a lot of energy, and because they are nonpolar they do not mix with water, so the body can pack them together tightly.",
 sci:"Hydrocarbons consist exclusively of carbon and hydrogen joined by nonpolar covalent bonds. The many energy-rich C-H bonds release substantial energy on oxidation, making hydrocarbon chains efficient energy storage. Their nonpolarity makes them hydrophobic. Fatty acid tails are hydrocarbon chains, which is why fat stores more than twice the energy per gram of carbohydrate.",
 trick:"Hydrocarbon = just H and C, nothing else invited. All those C-H bonds are packed batteries.",
 aloud:"Explain why fat stores more energy per gram than sugar, using the words C-H bonds and water."},

{q:"Isomers: structural, cis-trans, and enantiomers.",
 icon:"🪞",
 fig:"enantiomer",
 fig2:"aldoseKetose",
 plain:"Isomers are molecules with the exact same atoms arranged differently. Structural isomers have the atoms hooked up in a different order. Cis-trans isomers have the same order but different 3D positions around a double bond. Enantiomers are mirror images, like your left and right hand.",
 sci:"Isomers share a molecular formula but differ in structure. Structural isomers differ in the covalent arrangement of atoms (glucose vs fructose). Cis-trans (geometric) isomers differ in spatial arrangement around a carbon-carbon double bond, which cannot rotate freely. Enantiomers are non-superimposable mirror images arising from an asymmetric carbon. Biological receptors and enzymes are stereospecific, so enantiomers often have radically different effects. The thalidomide tragedy is the standard example: one enantiomer treated nausea, the other caused severe birth defects.",
 trick:"Enantiomer = your hands. Same fingers, same order, but a right glove will never fit your left hand. Your enzymes are the glove.",
 aloud:"Explain why a cell can tell two enantiomers apart. The answer is about shape and receptors, not about chemistry."},

{q:"Name all seven functional groups and what each one does.",
 icon:"🔮",
 fig:"funcGroups",
 plain:"They are the little attachments on a carbon skeleton that decide how a molecule actually behaves. Hydroxyl makes it water-friendly. Carbonyl makes sugars. Carboxyl is acidic. Amino is basic. Sulfhydryl makes bridges that lock shape. Phosphate carries energy and charge. Methyl is an inert tag.",
 sci:"Hydroxyl (-OH): polar, increases solubility, found in alcohols and sugars. Carbonyl (C=O): polar, aldehyde at a terminal carbon, ketone at an internal carbon. Carboxyl (-COOH): acidic, donates H+, present in amino acids and fatty acids. Amino (-NH2): basic, accepts H+, present in amino acids. Sulfhydryl (-SH): forms disulfide bridges that stabilize tertiary protein structure. Phosphate (-OPO3 2-): negatively charged, central to ATP energy transfer and the nucleic acid backbone. Methyl (-CH3): nonpolar and unreactive, functions as a tag that regulates gene expression.",
 trick:"Hey Cool Cats, All Sharks Phear Mermaids: Hydroxyl, Carbonyl, Carboxyl, Amino, Sulfhydryl, Phosphate, Methyl. Remember the acid/base pair: carbOXYL gives H+ away, aMINO takes it. They are the two ends of every amino acid.",
 aloud:"Pick any three groups and say what they do to a molecule's solubility, charge, and reactivity. That is the depth version of this question."}
]},
{id:"macro", name:"Macromolecules", chapter:"Ch 3", cards:[

{q:"What are the four classes of biological macromolecules, and what are their monomers?",
 icon:"🍱",
 fig:"macroFour",
 plain:"Carbohydrates, built from monosaccharides. Lipids, built from glycerol and fatty acids (the odd one out). Proteins, built from amino acids. Nucleic acids, built from nucleotides.",
 sci:"The four classes are carbohydrates (monomer: monosaccharide, polymer: polysaccharide), lipids (not true polymers; assembled from glycerol and fatty acid subunits), proteins (monomer: amino acid, polymer: polypeptide), and nucleic acids (monomer: nucleotide, polymer: DNA or RNA). Three of the four are true polymers; lipids are the exception because their subunits are not repeating identical units joined into a chain.",
 trick:"CLiPN, like 'clip-n': Carbs, Lipids, Proteins, Nucleic acids. Lipids are the rule-breaker in the group, remember that separately.",
 aloud:"Why are lipids not technically polymers? If you can answer that, you understand what a polymer actually is."},

{q:"Dehydration synthesis vs hydrolysis.",
 icon:"💦",
 fig:"dehydration",
 plain:"To join two building blocks, the cell pulls out a water molecule and uses the leftover ends to link them. To break them apart, the cell adds a water molecule back in and splits the bond. Building removes water, breaking adds water.",
 sci:"Dehydration synthesis (condensation) joins two monomers with covalent bond formation and releases one molecule of water; it is endergonic and requires enzymes. Hydrolysis cleaves a covalent bond by adding one molecule of water, with the hydroxyl going to one fragment and the hydrogen to the other; it is exergonic and is the chemical basis of digestion.",
 trick:"DE-hydration removes water. HYDRO-lysis uses water to LYSE (cut). 'Lysis' always means splitting.",
 aloud:"How many water molecules are released when 10 amino acids form one chain? Say why it is 9, not 10."},

{q:"What are carbohydrates, and what is the general formula?",
 icon:"🍚",
 fig:null,
 plain:"Sugars and starches. Quick energy plus some structural jobs. The formula is roughly one carbon, two hydrogens, one oxygen, repeated.",
 sci:"Carbohydrates have the general empirical formula (CH2O)n, meaning a 1:2:1 ratio of carbon, hydrogen, and oxygen. The name means hydrated carbon. Functions include short-term energy supply, energy storage, structural support, and cell-surface recognition markers.",
 trick:"Carbo-HYDRATE literally means watered carbon. C with H2O stuck to it.",
 aloud:"Glucose is C6H12O6. Check it against the ratio out loud."},

{q:"Monosaccharides: name three and why they matter.",
 icon:"🍯",
 fig:null,
 plain:"Glucose, fructose, and galactose. All three have the exact same atoms, C6H12O6, but arranged differently. Glucose is the fuel every cell runs on.",
 sci:"Monosaccharides are single sugar units and the simplest carbohydrates. Glucose is the primary cellular fuel and the input to glycolysis and cellular respiration. Fructose is found in fruit and is the sweetest natural sugar. Galactose is a component of lactose. All three share the formula C6H12O6 and are structural isomers of each other. Ribose and deoxyribose are five-carbon monosaccharides found in nucleic acids.",
 trick:"Mono = one. All three end in -ose, which is the sugar suffix. If it ends in -ose, it is a sugar.",
 aloud:"Same formula, different molecule. Explain how that is possible, and name what we call that relationship."},

{q:"Aldose vs ketose.",
 icon:"🍬",
 fig:"aldoseKetose",
 plain:"Both have a C=O group. If it sits at the end of the chain, it is an aldose, like glucose. If it sits in the middle, it is a ketose, like fructose.",
 sci:"Aldose sugars carry a carbonyl group at a terminal carbon, forming an aldehyde; glucose and galactose are aldoses. Ketose sugars carry the carbonyl at an internal carbon, forming a ketone; fructose is the standard ketose. The distinction affects ring structure and reactivity.",
 trick:"ALdose = At the end (A for the top of the chain). KEtose = Kept in the middle. Glucose is an aldose, fructose is a ketose: 'G is at the end of the alphabet stretch, F is in the middle' if that helps.",
 aloud:"Given any sugar structure, describe how to classify it in one sentence."},

{q:"How do disaccharides form? Name three.",
 icon:"🍭",
 fig:"glycosidic",
 plain:"Two single sugars join by dehydration synthesis, and the link between them is called a glycosidic bond. Sucrose is glucose plus fructose (table sugar). Lactose is glucose plus galactose (milk sugar). Maltose is glucose plus glucose (malt sugar).",
 sci:"A disaccharide forms when two monosaccharides are joined by a glycosidic linkage via dehydration synthesis. Sucrose = glucose + fructose. Lactose = glucose + galactose. Maltose = glucose + glucose. Lactose intolerance results from insufficient lactase, the enzyme that hydrolyzes the glycosidic bond in lactose.",
 trick:"GF, GG, GG-alactose. Sucrose = Sweet Fructose. Lactose = Lactation, so milk. Maltose = Malt, so two glucoses from grain.",
 aloud:"Explain lactose intolerance at the molecular level: which bond, which enzyme, what happens when the enzyme is missing."},

{q:"Starch, glycogen, and cellulose: compare structure and function.",
 icon:"🥔",
 fig:"polysacc",
 plain:"All three are long chains of glucose, but built differently. Starch is plant storage, lightly branched. Glycogen is animal storage, heavily branched so energy can be released fast. Cellulose is plant structure, perfectly straight with a different kind of bond, which is why we cannot digest it.",
 sci:"All three are glucose polymers. Starch (amylose and amylopectin) is the plant storage polysaccharide, with alpha glycosidic linkages and limited branching. Glycogen is the animal storage polysaccharide, stored in liver and muscle, with alpha linkages and extensive branching that provides many terminal ends for rapid enzymatic hydrolysis. Cellulose is the structural polysaccharide of plant cell walls, with beta glycosidic linkages that produce straight chains capable of hydrogen bonding into rigid microfibrils. Humans lack cellulase and cannot hydrolyze beta linkages, so cellulose passes through as dietary fiber. Chitin, the structural polysaccharide of arthropod exoskeletons and fungal cell walls, is a modified glucose polymer containing nitrogen.",
 trick:"Alpha = A for Available energy. Beta = B for Building material. Glycogen is branchier because animals move and need fuel NOW; plants can wait.",
 aloud:"Why can a cow digest cellulose and you cannot? The answer is not about the cow's stomach shape."},

{q:"What defines a lipid, and what do lipids do?",
 icon:"🥑",
 fig:null,
 plain:"Lipids are the greasy ones. What unites them is not a shared building block, it is that they are nonpolar and will not dissolve in water. They store energy, build membranes, insulate, cushion organs, and act as hormones.",
 sci:"Lipids are a chemically diverse group unified by hydrophobicity rather than by a common monomer. They are predominantly nonpolar and insoluble in water. Functions include long-term energy storage, membrane structure, thermal insulation, physical protection of organs, and chemical signaling as steroid hormones. Fat-soluble vitamins A, D, E, and K are also lipids.",
 trick:"Lipids are defined by what they refuse to do: mix with water. It is the only macromolecule class defined by a physical property instead of a building block.",
 aloud:"Name three structurally different lipids and explain what makes all three count as lipids anyway."},

{q:"Structure of a triglyceride, and saturated vs unsaturated.",
 icon:"🧈",
 fig:"fats",
 plain:"One glycerol with three fatty acid tails attached. If the tails have no double bonds they are straight, pack tightly, and the fat is solid, like butter. If they have double bonds the tails kink, cannot pack tightly, and the fat is liquid, like olive oil.",
 sci:"A triglyceride consists of a glycerol backbone joined to three fatty acids by ester linkages formed through dehydration synthesis. Saturated fatty acids contain no carbon-carbon double bonds, are saturated with hydrogen, pack densely, and are solid at room temperature; they are predominantly of animal origin and are associated with raised LDL cholesterol. Unsaturated fatty acids contain one or more double bonds that introduce cis kinks preventing dense packing, and are liquid at room temperature; they are predominantly plant and fish oils. Trans fats are artificially hydrogenated unsaturated fats whose trans double bonds do not kink, so they behave like saturated fats while being more harmful, raising LDL and lowering HDL.",
 trick:"SATURATED = the carbon is SAT with hydrogen, no room for more, straight and stiff and SOLID. Unsaturated has room, so it bends. 'Fats are solid, oils are oily' and now you know why.",
 aloud:"Explain the physical reason butter is solid using the words double bond, kink, and packing. That causal chain is what earns full credit."},

{q:"Structure of a phospholipid, and why it forms membranes.",
 icon:"🫧",
 fig:"phospholipid",
 plain:"A phosphate head that loves water, attached to two fatty acid tails that hate water. Drop a bunch in water and they automatically arrange into a double layer with all the heads facing out toward water and all the tails hiding inward. That double layer is your cell membrane.",
 sci:"A phospholipid has a glycerol backbone with two fatty acid chains and one phosphate-containing head group. The phosphate head is hydrophilic and the fatty acid tails are hydrophobic, making the molecule amphipathic. In aqueous environments, phospholipids spontaneously self-assemble into a bilayer with heads oriented toward water on both surfaces and tails sequestered in the interior. This arrangement is driven by the hydrophobic effect and creates a selectively permeable barrier, which is the physical basis of the cell as a distinct compartment.",
 trick:"A phospholipid is a lollipop with two legs. The head loves water, the legs hate it. Nobody assembles the membrane; it builds itself because that arrangement is the most stable.",
 aloud:"This is a top-tier depth question: explain why the bilayer forms WITHOUT saying the cell builds it. The driver is the water, not the cell."},

{q:"What makes steroids structurally different, and why are they still lipids?",
 icon:"💍",
 fig:"steroid",
 plain:"Steroids are four rings fused together, not chains. They look nothing like fats. They count as lipids because they are still nonpolar and still refuse to mix with water.",
 sci:"Steroids consist of four fused carbon rings, three six-membered and one five-membered, with varying functional groups attached. They lack fatty acid chains entirely, yet are classified as lipids on the basis of hydrophobicity. Cholesterol is the precursor for all other steroids and regulates membrane fluidity. Testosterone and estrogen are steroid hormones; cortisol regulates stress response and metabolism. Being nonpolar, steroid hormones pass directly through the plasma membrane and bind intracellular receptors.",
 trick:"Four rings fused = steroid. Cholesterol gets a bad reputation but it is the parent molecule of your sex hormones and it keeps membranes from freezing solid.",
 aloud:"Explain why steroid hormones can walk straight through the cell membrane while protein hormones cannot."},

{q:"List the functions of proteins.",
 icon:"🛠️",
 fig:null,
 plain:"Proteins do almost every job in the body. They speed up reactions, build structure, move things, carry messages, defend against infection, transport molecules, and store materials.",
 sci:"Protein functions include: enzymatic catalysis (amylase, DNA polymerase), structural support (collagen, keratin), transport (hemoglobin, membrane channel proteins), movement (actin and myosin), defense (antibodies), signaling (insulin and other peptide hormones), storage (casein, ferritin), and receptors for cell communication.",
 trick:"Proteins are the workforce. DNA is the manual, proteins are the workers. Every job you can name, some protein is doing it.",
 aloud:"Name one specific protein for each function. Specific examples are what separate a B answer from an A answer."},

{q:"Structure of an amino acid, and how peptide bonds form.",
 icon:"🧩",
 fig:"aminoAcid",
 plain:"A central carbon holding four things: an amino group, a carboxyl group, a hydrogen, and an R group. The R group is the only part that changes between the 20 amino acids, and it decides that amino acid's personality. Two amino acids join when the carboxyl of one bonds to the amino of the next, releasing water.",
 sci:"An amino acid consists of a central alpha carbon bonded to an amino group (-NH2), a carboxyl group (-COOH), a hydrogen atom, and a variable R group (side chain). The R group determines whether the amino acid is nonpolar, polar, acidic, or basic, and therefore determines how that residue behaves during folding. A peptide bond is a covalent bond formed by dehydration synthesis between the carboxyl carbon of one amino acid and the amino nitrogen of the next. Chains of amino acids are polypeptides; one or more folded polypeptides constitute a protein.",
 trick:"Every amino acid is the same except the R group. R for 'the Rest of it' and R for 'the Reason they differ.' Twenty amino acids, twenty different R groups, that is the whole story.",
 aloud:"Why do R groups matter so much for folding? Link it: an R group's chemistry determines where it wants to sit relative to water."},

{q:"The four levels of protein structure.",
 icon:"🧶",
 fig:"protein",
 plain:"Primary is the order of the amino acids, like letters in a word. Secondary is local twisting into coils or pleats, held by hydrogen bonds along the backbone. Tertiary is the whole chain folding into one 3D shape, driven by the R groups. Quaternary is two or more finished chains joining into one working unit.",
 sci:"Primary structure is the linear amino acid sequence, determined by the gene and joined by peptide bonds. Secondary structure comprises localized alpha helices and beta pleated sheets, stabilized by hydrogen bonds between backbone atoms, not R groups. Tertiary structure is the overall three-dimensional conformation of a single polypeptide, stabilized by R-group interactions including hydrophobic clustering, hydrogen bonds, ionic bonds, and covalent disulfide bridges. Quaternary structure is the assembly of multiple polypeptide subunits into a functional complex; hemoglobin with four subunits is the standard example. Not all proteins have quaternary structure.",
 trick:"Think of a phone cord: the plastic and wire is primary, the coil is secondary, the tangled mess in your bag is tertiary, and two cords knotted together is quaternary. Key exam detail: SECONDARY uses backbone hydrogen bonds, TERTIARY uses R-group interactions. Professors love that distinction.",
 aloud:"Alpha helix and beta pleated sheet are which level? Say it, then say what holds them together."},

{q:"What is denaturation, and is it reversible?",
 icon:"🍳",
 fig:"denature",
 plain:"Denaturation is when a protein loses its 3D shape and stops working. Heat, wrong pH, salt, or harsh chemicals can do it. The order of amino acids is untouched, only the folding is wrecked. Sometimes it can refold, often it cannot.",
 sci:"Denaturation is the disruption of a protein's secondary, tertiary, and quaternary structure without cleaving peptide bonds, so primary structure is retained. Causes include elevated temperature, extremes of pH, high salt concentration, and organic solvents, all of which disrupt the weak interactions maintaining the fold. Because function depends on conformation, denatured proteins lose activity. Some proteins renature spontaneously when normal conditions return, but many aggregate irreversibly; a fried egg is the standard irreversible example, where denatured albumin cannot revert to its soluble form.",
 trick:"A fried egg never un-fries. Denaturation destroys the SHAPE, not the SEQUENCE, which is why primary structure survives every time.",
 aloud:"Tie chapters together: why does a fever above about 104 F become dangerous? Answer in terms of enzymes and shape."},

{q:"What are nucleic acids and nucleotides?",
 icon:"🧬",
 fig:"dna",
 plain:"Nucleic acids are DNA and RNA, the molecules that store and carry genetic instructions. Their building block is the nucleotide, which is always three parts: a phosphate, a five-carbon sugar, and a nitrogenous base.",
 sci:"Nucleic acids are polymers of nucleotides that store, transmit, and express genetic information. Each nucleotide comprises a phosphate group, a pentose sugar (deoxyribose in DNA, ribose in RNA), and one nitrogenous base. Purines (adenine, guanine) have two rings; pyrimidines (cytosine, thymine, uracil) have one. Nucleotides are joined by phosphodiester bonds between the phosphate of one and the sugar of the next, forming the sugar-phosphate backbone.",
 trick:"Three parts: Phosphate, Sugar, Base. PSB, like 'peanut butter sandwich' out of order. Pure As Gold = PURines are Adenine and Guanine (two rings). CUT the PY = pyrimidines are Cytosine, Uracil, Thymine (one ring).",
 aloud:"Name the three parts without looking, then say which part differs between DNA and RNA."},

{q:"Describe DNA's double helix and complementary base pairing.",
 icon:"🪜",
 fig:"dna",
 plain:"Two strands twisted around each other like a spiral ladder. The sides are sugar and phosphate. The rungs are pairs of bases: A always pairs with T, G always pairs with C, held by hydrogen bonds. Because the pairing is fixed, one strand tells you exactly what the other says.",
 sci:"DNA is an antiparallel double helix with a sugar-phosphate backbone on the exterior and nitrogenous bases oriented inward. Complementary base pairing joins adenine to thymine by two hydrogen bonds and guanine to cytosine by three hydrogen bonds. A purine always pairs with a pyrimidine, keeping helix width constant. Because each strand specifies the sequence of the other, each serves as a template during semiconservative replication, which is the structural basis for accurate inheritance.",
 trick:"Apples in the Tree, Cars in the Garage. A-T, C-G. And G-C has 3 hydrogen bonds while A-T has 2, so GC-rich DNA is harder to pull apart.",
 aloud:"The depth question: explain how the STRUCTURE makes accurate copying possible. Structure to function, again."},

{q:"DNA vs RNA, and the three types of RNA.",
 icon:"📮",
 fig:"dnaRna",
 plain:"DNA is double stranded, uses deoxyribose, uses the base T, and stays in the nucleus. RNA is single stranded, uses ribose, uses U instead of T, and travels out to do the work. mRNA carries the message, tRNA delivers amino acids, rRNA builds the ribosome itself.",
 sci:"DNA is double-stranded, contains deoxyribose, uses thymine, and remains in the nucleus in eukaryotes as long-term genetic storage. RNA is typically single-stranded, contains ribose (with an additional hydroxyl group making it less chemically stable), uses uracil in place of thymine, and functions in the cytoplasm. Messenger RNA carries the transcribed coding sequence from nucleus to ribosome. Transfer RNA carries specific amino acids to the ribosome and reads codons via its anticodon. Ribosomal RNA is a structural and catalytic component of the ribosome.",
 trick:"DNA is the library book that never leaves the library. mRNA is the photocopy you carry out. U replaces T in RNA: 'U R the one that leaves.' Types: M for Message, T for Transfer/Taxi, R for Ribosome.",
 aloud:"Why does the cell bother making a copy instead of sending the DNA itself? Answer in terms of protecting the original."}
]},

{id:"virus", name:"Viruses", chapter:"Ch 21", cards:[

{q:"Describe the basic structure of a virus.",
 icon:"🦠",
 fig:"virus",
 fig2:"nakedEnv",
 plain:"At minimum: genetic material wrapped in a protein shell. Some also have a stolen piece of membrane around the outside with protein spikes sticking out that let them latch onto host cells.",
 sci:"All viruses possess a nucleic acid genome (DNA or RNA, single- or double-stranded) enclosed in a capsid built from repeating protein subunits called capsomeres. Enveloped viruses additionally possess a lipid bilayer envelope derived from host cell membrane during budding, studded with virally encoded glycoprotein spikes that mediate attachment to specific host cell receptors. Naked (non-enveloped) viruses lack this envelope and are generally more resistant to environmental conditions and disinfectants.",
 trick:"Capsid = the CAPsule holding the cargo. Spikes = the keys. Envelope = the stolen jacket, and it is made of lipid, which is exactly why soap wrecks enveloped viruses.",
 aloud:"Why does soap work against enveloped viruses? Connect it to the lipid card from Chapter 3."},

{q:"Why is a virus so specific about which cells it infects?",
 icon:"🔑",
 fig:null,
 plain:"The spikes on the virus have to physically fit a receptor protein on the host cell, like a key in a lock. No matching receptor, no entry, no infection.",
 sci:"Host range and tissue tropism are determined by the molecular complementarity between viral attachment proteins and specific host cell surface receptors. Absence of the required receptor confers resistance. This is why most viruses infect only one species, or only particular tissues within a species, and it also explains how mutations in attachment proteins can enable cross-species transmission.",
 trick:"Key and lock. Change the key shape (mutation) and suddenly a new species' door opens. That is how a virus jumps species.",
 aloud:"Explain why you cannot catch a plant virus."},

{q:"Walk through RNA virus replication inside a host cell.",
 icon:"🏭",
 fig:"viralRep",
 plain:"Attach to the cell, get inside and shed the coat, hijack the cell's machinery to copy the genome and make viral proteins, assemble new viruses, then leave by budding out or bursting the cell open.",
 sci:"The general cycle is attachment (spike binds host receptor), entry and uncoating (genome enters the cytoplasm), replication and biosynthesis (host ribosomes translate viral proteins; viral RNA-dependent RNA polymerase replicates the genome), assembly (new genomes packaged into newly synthesized capsids), and release by budding, which preserves the cell temporarily, or by lysis, which destroys it. RNA viruses mutate rapidly because RNA-dependent RNA polymerase lacks proofreading activity, which is why influenza vaccines are reformulated annually.",
 trick:"AURAR, say it as 'a roar': Attach, Uncoat, Replicate, Assemble, Release. The virus brings instructions and nothing else. Every tool belongs to the host.",
 aloud:"Which step is literally impossible without a host, and why? That is the answer that decides the 'are viruses alive' question."},

{q:"Why do RNA viruses mutate so fast?",
 icon:"💉",
 fig:"rnaMutate",
 plain:"The enzyme copying their genome makes mistakes and has no spell-check. Every mistake is a mutation, and with millions of copies made per infection, useful mutations show up fast.",
 sci:"RNA-dependent RNA polymerase lacks the 3' to 5' exonuclease proofreading activity found in DNA polymerases, resulting in error rates orders of magnitude higher than DNA replication. Combined with enormous burst sizes and short generation times, this produces high genetic variability, rapid evolution of new variants, immune escape, and antiviral resistance.",
 trick:"No spell-check. DNA polymerase proofreads, RNA polymerase does not. That single missing feature explains flu shots every year.",
 aloud:"Connect this to Chapter 1: how is viral variant emergence a real-time demonstration of natural selection?"},

{q:"Build a full answer to 'are viruses alive?'",
 icon:"⚖️",
 fig:"virusAlive",
 plain:"Say what a virus can do (carry genes, reproduce inside a host, evolve), say what it cannot do (make energy, make proteins, reproduce alone, it is not even made of cells), then pick the property you think decides it, and commit to a position.",
